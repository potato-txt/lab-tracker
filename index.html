<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실험 워크플로우 기록</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="실험 기록">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%233a6b5f'/%3E%3Cpath d='M70 38h40v46l30 52a12 12 0 0 1-10 18H50a12 12 0 0 1-10-18l30-52z' fill='none' stroke='%23fbfaf7' stroke-width='9' stroke-linejoin='round'/%3E%3Cpath d='M58 108h64' stroke='%23fbfaf7' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ui:-apple-system,'Segoe UI',system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo',monospace;
  --paper:#f3f1ec; --card:#fbfaf7; --line:#dcd7cc;
  --ink:#26241f; --ink-soft:#6b675d; --accent:#3a6b5f;
  --st-todo:#a8a29a; --st-run:#c98a2b; --st-done:#3a8f6a; --st-fail:#c0503f;
  --tap:46px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(58,107,95,.12)}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;overscroll-behavior-y:none;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none !important}

/* ── 상단바 ─────────────────────────────── */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(var(--top) + 10px) 16px 0;}
.hrow{display:flex;align-items:center;gap:12px;}
.htitle{flex:1;min-width:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);}
h1{margin:1px 0 0;font-size:19px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.save{font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding:5px 10px;border:1px solid var(--line);border-radius:20px;background:var(--card);white-space:nowrap;}
.save.saved{color:var(--st-done);border-color:var(--st-done)}
.save.error{color:var(--st-fail);border-color:var(--st-fail)}
.iconbtn{width:var(--tap);height:var(--tap);flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;background:none;border:1px solid var(--line);border-radius:11px;background:var(--card);}
.tabs{display:flex;gap:2px;margin-top:8px;}
.tab{min-height:var(--tap);padding:0 18px;font-size:15px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-bottom:2.5px solid transparent;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ── 본문 레이아웃 ───────────────────────── */
main{padding:16px 16px calc(28px + var(--bot));max-width:1400px;margin:0 auto;}
.split{display:grid;grid-template-columns:1fr;gap:18px;align-items:start;}
@media(min-width:900px){
  .split{grid-template-columns:320px 1fr;}
  .backbtn{display:none}
  .pane-list,.pane-detail{display:block !important}
}
@media(max-width:899px){
  .split.detail-mode .pane-list{display:none}
  .split:not(.detail-mode) .pane-detail{display:none}
}
.backbtn{min-height:var(--tap);display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;padding:0 15px 0 11px;font-size:14px;font-weight:600;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:11px;}

/* ── 진행 배너 · 진행률 ──────────────────── */
.now{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:12px;padding:13px 15px;border-radius:11px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--st-todo);}
.now.set{border-left-color:var(--st-run);background:#fbf3e4}
.now .dot{width:11px;height:11px;border-radius:50%;background:var(--st-run);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,138,43,.5)}70%{box-shadow:0 0 0 9px rgba(201,138,43,0)}100%{box-shadow:0 0 0 0 rgba(201,138,43,0)}}
@media(prefers-reduced-motion:reduce){.now .dot{animation:none}}
.now .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--st-run);text-transform:uppercase}
.now .nm{font-size:16px;font-weight:650;background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--st-run)}
.now .ph{font-size:13px;color:var(--ink-soft)}
.now .empty{font-size:14px;color:var(--ink-soft);font-style:italic}
.bar{position:relative;height:30px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3a8f6a,#4aa87e);transition:width .4s ease}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;mix-blend-mode:luminosity}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--ink-soft)}
.legend b{display:inline-flex;align-items:center;gap:6px;font-weight:400}
.legend b i,.chip i,.node .sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* ── 목록 ───────────────────────────────── */
.group{margin-bottom:18px}
.group>h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink-soft);padding-left:2px}
.node{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:8px;font-size:15px;}
.node.on{border-color:var(--accent);background:#eef3f1;box-shadow:inset 3px 0 0 var(--accent)}
.node.cur{border-color:var(--st-run);background:#fbf3e4;box-shadow:inset 3px 0 0 var(--st-run)}
.node .nm{flex:1}
.node .sdot{background:var(--st-todo)}
.node.st-running .sdot{background:var(--st-run)}
.node.st-done .sdot{background:var(--st-done)}
.node.st-failed .sdot{background:var(--st-fail)}
.badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:10px;flex:none}
.badge.here{background:var(--st-run);color:#fff}
.badge.pic{color:var(--accent);border:1px solid var(--line)}
.badge.flag{color:var(--st-fail)}
.addnode{width:100%;min-height:var(--tap);font-size:14px;color:var(--accent);background:none;border:1px dashed var(--line);border-radius:11px}

/* ── 상세 ───────────────────────────────── */
.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.dhead{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dphase{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.05em}
.detail h2{margin:8px 0 5px;font-size:22px;font-weight:640}
.dnote{margin:0;font-size:14px;color:var(--ink-soft)}
.herebtn{min-height:var(--tap);padding:0 16px;font-size:13.5px;font-weight:600;color:var(--st-run);background:none;border:1px solid var(--st-run);border-radius:23px}
.herebtn.on{background:var(--st-run);color:#fff}
.delbtn{min-height:var(--tap);padding:0 16px;font-size:13.5px;color:var(--st-fail);background:none;border:1px solid var(--line);border-radius:23px}
.field{margin-bottom:22px}
.field>label,.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:9px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.frow label{margin:0}
.toggle{min-height:38px;padding:0 12px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:8px}
.addbtn{min-height:40px;padding:0 15px;font-size:13.5px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:9px}
.empty{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin:4px 0 0}

/* 프로토콜 */
.proto{margin:0;padding:0;list-style:none;counter-reset:p}
.proto li{position:relative;counter-increment:p;padding:9px 4px 9px 42px;font-size:15px;line-height:1.6;border-bottom:1px dashed var(--line)}
.proto li::before{content:counter(p);position:absolute;left:6px;top:9px;font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--paper);border:1px solid var(--line);border-radius:6px;width:24px;height:22px;display:flex;align-items:center;justify-content:center}
.proto li:last-child{border-bottom:none}
.proto li.k-sub{counter-increment:none;background:#eef3f1;font-weight:600;color:var(--accent);padding:8px 12px;border-radius:7px;margin:11px 0 6px;border-bottom:none}
.proto li.k-sub::before{display:none}
.proto li.k-item{counter-increment:none;padding:4px 4px 4px 42px;border-bottom:none}
.proto li.k-item::before{content:"–";border:none;background:none;color:var(--ink-soft);width:auto;height:auto;left:24px;top:4px;font-size:15px}
.proto li.k-note{counter-increment:none;padding:2px 4px 8px 42px;font-size:14px;color:var(--ink-soft);border-bottom:none}
.proto li.k-note::before{display:none}
.proto li.k-warn{counter-increment:none;padding:8px 12px;font-size:14px;font-weight:600;color:var(--st-fail);background:rgba(192,80,63,.07);border-radius:7px;border-bottom:none;margin:6px 0}
.proto li.k-warn::before{display:none}

/* 표 */
table.rt{width:100%;border-collapse:collapse;font-size:15px}
table.rt th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);padding:9px 11px;background:#eef3f1;border-bottom:1px solid var(--line)}
table.rt td{padding:10px 11px;border-bottom:1px dashed var(--line);vertical-align:top}
table.rt tr:last-child td{border-bottom:none}
table.rt td:first-child{font-weight:600}
table.rt td:not(:first-child){font-family:var(--mono);font-size:14px}
ul.rnotes{margin:0;padding-left:19px}
ul.rnotes li{font-size:14.5px;color:var(--ink-soft);margin-bottom:6px}

/* 입력 */
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 16px;font-size:14px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:23px}
.chip.on{font-weight:600;background:var(--card)}
input[type=date],input[type=text],textarea{width:100%;font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 13px}
input[type=date]{min-height:var(--tap)}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,107,95,.13)}
.titlein{width:100%;margin-top:8px;font-size:21px;font-weight:640;background:none;border:none;border-bottom:1px dashed var(--line);padding:3px 0;border-radius:0}

/* 트러블슈팅 */
.tr{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--st-fail);border-radius:10px;padding:12px;margin-bottom:10px}
.tr .n{font-family:var(--mono);font-size:13px;color:var(--st-fail);font-weight:600;padding-top:12px}
.tr .f{flex:1;display:flex;flex-direction:column;gap:8px}
.tr .x{width:var(--tap);height:var(--tap);flex:none;font-size:22px;color:var(--ink-soft);background:none;border:none;border-radius:9px}

/* 사진 */
.drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:11px;padding:12px 14px;background:var(--paper)}
.drop.over{border-color:var(--accent);background:#eef3f1}
.drop input[type=file]{display:none}
.picbtn{min-height:var(--tap);padding:0 18px;font-size:14.5px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px}
.picbtn[disabled]{opacity:.6}
.drophint{font-size:13.5px;color:var(--ink-soft)}
.picerr{font-size:13.5px;color:var(--st-fail);margin:9px 0 0}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px;margin-top:13px}
.pic{position:relative;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.pic .thumb{display:block;width:100%;height:132px;padding:0;border:none;background:#e6e2da}
.pic .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pic .x{position:absolute;top:6px;right:6px;width:34px;height:34px;font-size:19px;line-height:1;color:#fff;background:rgba(38,36,31,.62);border:none;border-radius:50%}
.pic figcaption{padding:8px}
.pic figcaption input{font-size:14px;padding:8px 9px;background:var(--card)}

/* 확대 · 시트 */
.lbox{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + var(--top)) 22px calc(24px + var(--bot));background:rgba(24,22,19,.88)}
.lbox img{max-width:100%;max-height:74vh;border-radius:8px}
.lbox p{margin:0;font-size:15px;color:#f3f1ec;text-align:center}
.lbox button{min-height:var(--tap);padding:0 20px;font-size:14px;color:#f3f1ec;background:none;border:1px solid rgba(243,241,236,.55);border-radius:23px}
.sheet{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;background:rgba(24,22,19,.45)}
.sheet .card{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + var(--bot))}
@media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sub{margin:0 0 16px;font-size:13.5px;color:var(--ink-soft)}
.sheet button.row{display:block;width:100%;min-height:52px;text-align:left;padding:0 16px;margin-bottom:9px;font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:11px}
.sheet .close{color:var(--ink-soft);text-align:center}
select{width:100%;min-height:var(--tap);font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:0 12px}
.dtopbtns{display:flex;gap:8px;flex-wrap:wrap}
.edrow{display:flex;gap:10px;flex-wrap:wrap}
.edrow .addbtn,.edrow .delbtn{min-height:var(--tap);padding:0 22px;font-size:15px}
.rule{margin-top:10px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.85;color:var(--ink-soft)}
.rule b{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600}
.stat{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin:14px 0 0;line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htitle">
      <div class="eyebrow">Cloning → Expression → Purification</div>
      <h1>실험 워크플로우 기록</h1>
    </div>
    <span class="save" id="save">자동 저장</span>
    <button class="iconbtn" id="menu" aria-label="메뉴">⋯</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="flow">실험 흐름</button>
    <button class="tab" data-tab="prep">제작 · 준비</button>
  </div>
</header>

<main id="app">불러오는 중…</main>

<script>
/* ══ 프로토콜 데이터 ══ */
const PHASES = [
  {
    id: "prep",
    label: "1. Insert / Vector 준비",
    steps: [
      {
        id: "pcr",
        name: "PCR",
        note: "target DNA 증폭 → 전기영동으로 밴드 확인",
        protocol: [
          "[재료]",
          "- ADW, buffer (target의 GC content에 따라 HF / GC buffer 선택), primer(f/r), template DNA, dNTPs, polymerase",
          "- PCR tube(오른쪽 실험 테이블 위 선반), PCR rack(오른쪽 테이블 서랍)",
          "[조성 — 총 25µl 고정]",
          "- ADW 17.6µl",
          "- 5X HF buffer 5µl (최종 1X 농도)",
          "- template DNA 1µl",
          "- dNTPs 0.5µl",
          "- primer f / r 각 0.3µl",
          "- polymerase 0.3µl",
          "(조성을 바꿀 때는 ADW 용량으로 조절한다 — 예: DMSO 추가, MgCl₂ 추가, template 증감. 전체 볼륨 25µl는 고정)",
          "[반응액 만들기]",
          "PCR tube에 라벨링 — target 이름. 농도 등 조건을 여러 개 진행하면 구분 표시를 추가",
          "부피가 큰 순서대로 PCR tube에 넣기",
          "(ADW를 제외한 시약은 사용 전 pipetting — 절반 이상의 볼륨으로)",
          "(polymerase는 glycerol이 들어 있어 천천히 pipetting)",
          "(벽면에 시약이 많이 붙었으면 spin down 5~10초)",
          "[PCR machine]",
          "machine에 PCR tube 넣고 shift로 A / B 선택",
          "file → 9 → mode → pf61 → edit",
          "Tm은 낮은 쪽 primer에 맞춰 설정",
          "extension 조건 설정 (1kbp당 30초)",
          "save 반복 → 기다리라는 창 → another option → run → volume 25µl → run",
          "[전기영동]",
          "PCR 시간이 얼마 안 남았을 때 ladder(100bp plus marker), dye(purple dye, 냉동실), pipette, parafilm, 잘라놓은 gel을 미리 준비",
          "parafilm에 dye 1µl를 올리고 PCR product 5µl를 pipetting으로 혼합",
          "gel을 기계 위에 올리고 ladder → 시료 순서로 well에 loading",
          "(ladder도 pipetting 후 넣기)",
          "gel을 홈 사이에 맞추고 전원을 켜서 run — 50V, 60min",
        ],
      },
      {
        id: "cu1",
        name: "PCR clean up",
        note: "PCR product 정제 · ADW 50µl elution",
        protocol: [
          "[재료]",
          "- PCR purification kit (선반) — 키트 내 동봉 프로토콜 참조",
          "[진행]",
          "PCR sample volume의 5배에 해당하는 buffer PCR-B 넣기",
          "spin column에 라벨링 후 sample을 column으로 옮기기",
          "centrifuge 1min, 13,000rpm → 아래 남은 flowthrough 버리기",
          "buffer PW 700µl 넣기",
          "(PW는 에탄올이 추가되었다는 체크표시를 확인하고 사용)",
          "centrifuge 1min, 13,000rpm → 아래 남은 flowthrough 버리기",
          "추가로 centrifuge 1min, 13,000rpm (잔여 에탄올 제거)",
          "아래 tube를 버리고 새 EP tube로 column 옮기기 — 라벨링(날짜, target 이름, C.U.)",
          "ADW 50µl로 elution",
          "(ADW는 미리 꺼내서 녹여두기)",
          "★ Enzyme cut 후의 clean up은 ADW 20µl로 elution",
          "centrifuge 1min, 13,000rpm — EP tube 뚜껑은 왼쪽에 두고 돌리기",
          "위의 column은 버리고 EP tube만 남기기",
        ],
      },
      {
        id: "re",
        name: "Restriction Enzyme cut",
        note: "insert · vector 제한효소 절단 · 2h incubation",
        protocol: [
          "[재료]",
          "- insert DNA, R.E (작은 icebox), buffer, vector",
          "(R.E는 회사 사이트에서 어떤 buffer를 쓰는지 미리 확인)",
          "[진행]",
          "EP tube에 라벨링 — 날짜, 제한효소, target 이름",
          "buffer는 녹인 후 vortexing, DNA는 pipetting",

/* 기본 PHASES + 사용자가 파일로 추가한 단계를 합친다 */
function phaseList(){
  const mine = S.customSteps || [];
  const out = PHASES.map(p => ({ id:p.id, label:p.label, steps: p.steps.concat(mine.filter(c => c.phase === p.id)) }));
  const etc = mine.filter(c => !PHASES.some(p => p.id === c.phase));
  if(etc.length) out.push({ id:"etc", label:"추가한 프로토콜", steps:etc });
  return out;
}
function allSteps(){ return phaseList().flatMap(p => p.steps.map(s => ({ ...s, phaseLabel:p.label }))); }
function STEP(id){ return allSteps().find(s => s.id === id); }
function isMine(id){ return (S.customSteps || []).some(c => c.id === id); }

/* ══ 저장소 — IndexedDB → localStorage → 메모리 ══ */
const Store = (() => {
  let mode = "memory", db = null, mem = {};
  const wrap = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
  async function init(){
    try{
      if(!self.indexedDB) throw 0;
      db = await new Promise((res, rej) => {
        const rq = indexedDB.open("lab_tracker", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
        rq.onsuccess = () => res(rq.result);
        rq.onerror   = () => rej(rq.error);
        rq.onblocked = () => rej(new Error("blocked"));
        setTimeout(() => rej(new Error("timeout")), 4000);
      });
      mode = "idb"; return mode;
    }catch(e){}
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); mode = "local"; }
    catch(e){ mode = "memory"; }
    return mode;
  }
  async function get(k){
    if(mode === "idb"){ const v = await wrap(db.transaction("kv","readonly").objectStore("kv").get(k)); return v === undefined ? null : v; }
    if(mode === "local"){ const v = localStorage.getItem(k); return v === null ? null : JSON.parse(v); }
    return k in mem ? mem[k] : null;
  }
  async function set(k, v){
    if(mode === "idb") return wrap(db.transaction("kv","readwrite").objectStore("kv").put(v, k));
    if(mode === "local") return localStorage.setItem(k, JSON.stringify(v));
    mem[k] = v;
  }
  async function keys(){
    if(mode === "idb") return wrap(db.transaction("kv","readonly").objectStore("kv").getAllKeys());
    if(mode === "local") return Object.keys(localStorage);
    return Object.keys(mem);
  }
  async function del(k){
    if(mode === "idb") return wrap(db.transaction("kv","readwrite").objectStore("kv").delete(k));
    if(mode === "local") return localStorage.removeItem(k);
    delete mem[k];
  }
  return { init, get, set, keys, del, get mode(){ return mode; } };
})();

  const el = document.getElementById("save");
  el.className = "save " + (kind || "");
  el.textContent = kind === "saved" ? "저장됨 ✓" : kind === "error" ? "저장 실패" : kind === "saving" ? "저장 중…" : "자동 저장";
  clearTimeout(saveTimer);
  if(kind) saveTimer = setTimeout(() => flag(""), 1700);
}
async function save(){
  flag("saving");
  try{ await Store.set(KEY, S); flag("saved"); }
  catch(e){ flag("error"); }
}
function patch(id, obj){ S.steps[id] = { ...S.steps[id], ...obj }; save(); render(); }

/* ══ 프로토콜 줄 해석 ══
   [재료]·[준비물]·[material] 소제목 아래, 그리고 "-"로 시작하는 줄은 순서가 아니므로 번호를 붙이지 않는다. */
const LIST_HEAD = /재료|준비물|material/i;
function parseProtocol(lines){
  let inList = false;
  return lines.map(l => {
    if(l.startsWith("[")){ inList = LIST_HEAD.test(l); return { k:"sub",  t:l }; }
    if(l.startsWith("★")) return { k:"warn", t:l };
    if(l.startsWith("(") || l.startsWith("※")) return { k:"note", t:l };
    if(l.startsWith("-")) return { k:"item", t:l.replace(/^-\s*/, "") };
    return inList ? { k:"item", t:l } : { k:"step", t:l };
  });
}

/* ══ 프로토콜 문서 불러오기 ══
   hwpx / docx 는 ZIP + XML 이라 브라우저에서 바로 풀 수 있다. 외부 라이브러리 없음. */
async function unzip(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("압축 파일 구조를 읽지 못했습니다");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const out = {};
  for(let i = 0; i < count; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = dec.decode(buf.subarray(off + 46, off + 46 + nlen));
    const lnlen  = dv.getUint16(lho + 26, true);
    const lelen  = dv.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    out[name] = { method, data: buf.subarray(start, start + csize) };
    off += 46 + nlen + elen + clen;
  }
  return out;
}
async function inflate(entry){
  if(entry.method === 0) return entry.data;
  if(typeof DecompressionStream === "undefined")
    throw new Error("이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome이나 Safari에서 열어 주세요.");
  const stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/* 문단 단위로 글자만 뽑는다. 표 안의 문단은 칸별로 한 줄이 된다. */
function paragraphs(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.querySelector("parsererror")) return [];
  const out = [];
  const ps = Array.from(doc.getElementsByTagName("*")).filter(e => e.localName === "p");
  for(const p of ps){
    if(Array.from(p.getElementsByTagName("*")).some(c => c.localName === "p")) continue; // 바깥 문단은 건너뛰어 중복 방지
    const t = Array.from(p.getElementsByTagName("*"))
      .filter(c => c.localName === "t").map(c => c.textContent).join("");
    out.push(t);
  }
  return out;
}
async function readDoc(file){
  const nm = (file.name || "").toLowerCase();
  if(nm.endsWith(".txt") || nm.endsWith(".md")) return (await file.text()).split(/\r?\n/);
  if(nm.endsWith(".hwp")) throw new Error("구형 .hwp 는 읽지 못합니다. 한글에서 .hwpx 로 저장한 뒤 다시 넣어 주세요.");
  const files = await unzip(file);
  let targets = Object.keys(files).filter(n => /^Contents\/section\d+\.xml$/i.test(n)).sort();
  if(!targets.length && files["word/document.xml"]) targets = ["word/document.xml"];
  if(!targets.length) throw new Error("hwpx · docx · txt 파일만 읽을 수 있습니다");
  const lines = [];
  const dec = new TextDecoder();
  for(const t of targets) lines.push(...paragraphs(dec.decode(await inflate(files[t]))));
  return lines;
}
/* 뽑은 줄을 이 앱의 표기 규칙으로 바꾼다. 완벽하진 않으니 저장 전에 손볼 수 있게 한다. */
const HEAD_WORD = /^(재료|준비물|준비|조성|진행|방법|과정|순서|주의|참고|원리|설정|조작|보관|결과)/;
const PAIRS = { "<":">", "【":"】", "[":"]", "〈":"〉", "《":"》" };   // 괄호 ( ) 는 부연 설명이므로 제외
function autoFormat(lines){
  return lines
    .map(l => l.replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim())
    .filter(Boolean)
    .map(l => {
      let t = l.replace(/^[◎◇◆■□▶▷●○]\s*/, "");
      const close = PAIRS[t[0]];
      if(close && t.endsWith(close)){
        const bare = t.slice(1, -1).trim();
        if(bare && bare.length <= 30) return "[" + bare + "]";
      }
      if(/^[-–—•·]\s*/.test(t)) return "- " + t.replace(/^[-–—•·]\s*/, "");
      if(/^※/.test(t) || /^\(/.test(t) || /^★/.test(t)) return t;
      t = t.replace(/^\d+\s*[.)]\s*/, "");                       // 번호는 앱이 다시 매긴다
      if(t.length <= 14 && HEAD_WORD.test(t) && !/[.。]$/.test(t)) return "[" + t + "]";
      if(!/\s/.test(t) && t.length <= 20 && !/\d/.test(t) && !/[.。,]$/.test(t)) return "[" + t + "]";
      return t;
    })
    .filter(Boolean);
}

/* ══ 사진 ══ */
function readDataUrl(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error("파일을 읽지 못했습니다"));
    fr.readAsDataURL(file);
  });
}
async function shrink(file){
  const raw = await readDataUrl(file);
  try{
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("decode"));
      im.src = raw;
    });
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width  = Math.round(img.width  * scale);
    c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const out = c.toDataURL("image/jpeg", 0.75);
    return out.length < raw.length ? out : raw;
  }catch(e){ return raw; }
}
async function loadPics(id){
  if(pics[id] !== undefined) return;
  try{ pics[id] = (await Store.get(PKEY(id))) || []; }
  catch(e){ pics[id] = []; }
  render();
}
async function savePics(id, arr){
  const size = JSON.stringify(arr).length;
  if(size > PIC_LIMIT){
    ui.picErr = "이 단계의 사진 용량이 한도를 넘습니다. 오래된 사진을 지우고 다시 넣어 주세요.";
    render(); return false;
  }
  pics[id] = arr;
  ui.picErr = "";
  flag("saving");
  try{ await Store.set(PKEY(id), arr); flag("saved"); }
  catch(e){
    flag("error");
    ui.picErr = "저장 공간이 부족합니다. 사진을 줄이거나 백업 후 정리해 주세요.";
  }
  patch(id, { photoN: arr.length });
  return true;
}
async function addPics(id, fileList){
  const picked = Array.from(fileList || []);
  const files = picked.filter(f => f.type && f.type.startsWith("image/"));
  if(!files.length){ ui.picErr = picked.length ? "이미지 파일만 넣을 수 있습니다." : "고른 파일이 없습니다."; render(); return; }
  ui.busy = true; ui.picErr = ""; render();
  try{
    const made = [];
    for(const f of files){
      made.push({ id: Date.now() + "_" + Math.random().toString(36).slice(2,7), name:f.name, caption:"", data: await shrink(f) });
    }
    await savePics(id, [...(pics[id] || []), ...made]);
  }catch(e){ ui.picErr = e.message || "사진을 넣지 못했습니다."; }
  ui.busy = false; render();
}

async function importDoc(file){
  ui.busy = true; ui.impErr = ""; render();
  try{
    const lines = autoFormat(await readDoc(file));
    if(!lines.length) throw new Error("문서에서 글자를 찾지 못했습니다");
    const ed = ui.editor || { id:null, phase:PHASES[0].id, name:"", note:"", text:"" };
    ed.text = lines.join("\n");
    if(!ed.name) ed.name = (file.name || "").replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").trim();
    ui.editor = ed;
  }catch(err){ ui.impErr = err.message || "파일을 읽지 못했습니다"; }
  ui.busy = false; render();
}

/* ══ 백업 ══ */
async function exportAll(){
  const out = { v:1, at:new Date().toISOString(), state:S, pics:{} };
  for(const s of allSteps()){
    const arr = pics[s.id] !== undefined ? pics[s.id] : await Store.get(PKEY(s.id));
    if(arr && arr.length) out.pics[s.id] = arr;
  }
  const blob = new Blob([JSON.stringify(out)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lab_tracker_" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importAll(file){
  const text = await file.text();
  const obj = JSON.parse(text);
  if(!obj || !obj.state) throw new Error("형식이 맞지 않는 파일입니다");
  S = obj.state;
  S.customSteps = S.customSteps || [];
  allSteps().forEach(s => { S.steps[s.id] = { ...blank(), ...(S.steps[s.id] || {}) }; });
  await Store.set(KEY, S);
  pics = {};
  for(const [id, arr] of Object.entries(obj.pics || {})) await Store.set(PKEY(id), arr);
  render();
}

      RECIPES.filter(r => r.cat === c.id).map(r =>
        `<button class="node ${ui.recipe===r.id?"on":""}" data-act="openr" data-id="${r.id}">
          <span class="nm">${esc(r.name)}</span>${S.memos[r.id]?'<span class="badge pic">메모</span>':""}</button>`).join("") + `</div>`).join("")
    + `<div class="group"><h2>내가 추가한 것</h2>` + S.custom.map(c =>
        `<button class="node ${ui.recipe===c.id?"on":""}" data-act="openr" data-id="${c.id}">
          <span class="nm">${esc(c.name || "제목 없음")}</span></button>`).join("")
    + `<button class="addnode" data-act="addcustom">+ 항목 추가</button></div>`;

  const cu = S.custom.find(c => c.id === ui.recipe);
  const r  = RECIPES.find(x => x.id === ui.recipe);
  let detail;
  if(cu){
    detail = `<div class="detail">
      <div class="dhead"><div class="dtop"><div class="dphase">내가 추가한 것</div>
        <button class="delbtn" data-act="delcustom" data-id="${cu.id}">항목 삭제</button></div>
        <input class="titlein" type="text" value="${esc(cu.name)}" placeholder="항목 이름 (예: 1X TAE buffer)" data-act="cname" data-id="${cu.id}"></div>
      <div class="field"><label for="cb">만드는 법</label>
        <textarea id="cb" rows="14" placeholder="조성, 순서, 보관 조건, 재료 위치 등을 자유롭게 적으세요." data-act="cbody" data-id="${cu.id}">${esc(cu.body)}</textarea></div>
    </div>`;
  } else if(r){
    detail = `<div class="detail">
      <div class="dhead"><div class="dphase">${esc(RECIPE_CATS.find(c=>c.id===r.cat).label)}</div>
        <h2>${esc(r.name)}</h2><p class="dnote">${esc(r.sub)}</p></div>
      <div class="field"><span class="flabel">조성</span>
        <table class="rt"><thead><tr>${r.table.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${r.table.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${r.notes && r.notes.length ? `<div class="field"><span class="flabel">참고</span><ul class="rnotes">${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
      <div class="field"><label for="mm">내 메모</label>
        <textarea id="mm" rows="4" placeholder="바뀐 농도, 실제로 쓴 양, 재고 위치 등" data-act="memo" data-id="${r.id}">${esc(S.memos[r.id]||"")}</textarea></div>
    </div>`;
  } else detail = `<div class="detail"><p class="empty">왼쪽에서 항목을 고르세요.</p></div>`;

  return `<p class="dnote" style="margin:0 0 16px">실험 흐름과 별개로, 미리 만들어 두거나 그때그때 조성을 맞춰야 하는 것들입니다.</p>
    <div class="split ${ui.detail?"detail-mode":""}">
      <div class="pane-list">${list}</div>
      <div class="pane-detail"><button class="backbtn" data-act="back">‹ 목록</button>${detail}</div>
    </div>`;
}

function render(){
  const app = document.getElementById("app");
  const focus = document.activeElement;
  let keep = null;
  if(focus && focus.dataset && focus.dataset.act){
    let pos = null;
    try{ pos = focus.selectionStart; }catch(e){}   // date 입력은 selectionStart를 못 읽는다
    keep = { act:focus.dataset.act, id:focus.dataset.id || "", f:focus.dataset.f || "", pos };
  }

  app.innerHTML = ui.tab === "flow" ? viewFlow() : viewPrep();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === ui.tab));

  if(keep){
    const sel = `[data-act="${keep.act}"]` + (keep.id?`[data-id="${keep.id}"]`:"") + (keep.f?`[data-f="${keep.f}"]`:"");
    const n = app.querySelector(sel);
    if(n && n.focus){ n.focus(); if(keep.pos != null){ try{ n.setSelectionRange(keep.pos, keep.pos); }catch(e){} } }
  }
  if(ui.tab === "flow") loadPics(ui.step);
}

/* ══ 이벤트 ══ */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  ui.tab = b.dataset.tab; ui.detail = false; render();
});

document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(a === "open"){ ui.step = id; ui.detail = true; ui.picErr = ""; render(); window.scrollTo(0,0); }
  else if(a === "openr"){ ui.recipe = id; ui.detail = true; render(); window.scrollTo(0,0); }
  else if(a === "back"){ ui.detail = false; render(); }
  else if(a === "here"){ S.current = S.current === id ? null : id; save(); render(); }
  else if(a === "status"){ patch(id, { status:b.dataset.v }); }
  else if(a === "toggleproto"){ ui.showProto = !ui.showProto; render(); }
  else if(a === "addtr"){ patch(ui.step, { trouble:[...S.steps[ui.step].trouble, { id:Date.now(), problem:"", cause:"", fix:"" }] }); }
  else if(a === "deltr"){ patch(ui.step, { trouble:S.steps[ui.step].trouble.filter(t => String(t.id) !== id) }); }
  else if(a === "pick"){ document.getElementById("picinput").click(); }
  else if(a === "delpic"){ savePics(ui.step, (pics[ui.step]||[]).filter(p => p.id !== id)); }
  else if(a === "zoom"){ const p = (pics[ui.step]||[]).find(x => x.id === id); if(p) lightbox(p); }
  else if(a === "ed-new"){ ui.editor = { id:null, phase:PHASES[0].id, name:"", note:"", text:"" }; ui.impErr = ""; render(); window.scrollTo(0,0); }
  else if(a === "ed-edit"){
    const c = S.customSteps.find(x => x.id === id);
    if(c){ ui.editor = { id:c.id, phase:c.phase, name:c.name, note:c.note, text:(c.protocol||[]).join("\n") }; ui.impErr = ""; render(); window.scrollTo(0,0); }
  }
  else if(a === "ed-pick"){ document.getElementById("docinput").click(); }
  else if(a === "ed-cancel"){ ui.editor = null; render(); }
  else if(a === "ed-del"){
    const eid = ui.editor.id;
    S.customSteps = S.customSteps.filter(x => x.id !== eid);
    delete S.steps[eid];
    if(S.current === eid) S.current = null;
    Store.del(PKEY(eid)); delete pics[eid];
    ui.editor = null; ui.step = PHASES[0].steps[0].id; ui.detail = false;
    save(); render();
  }
  else if(a === "ed-save"){
    const ed = ui.editor;
    const lines = ed.text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    if(!ed.name.trim()){ ui.impErr = "단계 이름을 적어 주세요."; render(); return; }
    if(!lines.length){ ui.impErr = "내용이 비어 있습니다."; render(); return; }
    if(ed.id){
      const c = S.customSteps.find(x => x.id === ed.id);
      Object.assign(c, { phase:ed.phase, name:ed.name.trim(), note:ed.note.trim(), protocol:lines });
      ui.step = c.id;
    }else{
      const it = { id:"s"+Date.now(), phase:ed.phase, name:ed.name.trim(), note:ed.note.trim(), protocol:lines };
      S.customSteps.push(it);
      S.steps[it.id] = blank();
      ui.step = it.id;
    }
    ui.editor = null; ui.detail = true; ui.impErr = "";
    save(); render();
  }
  else if(a === "addcustom"){ const it = { id:"c"+Date.now(), name:"새 항목", body:"" }; S.custom.push(it); ui.recipe = it.id; ui.detail = true; save(); render(); }
  else if(a === "delcustom"){ S.custom = S.custom.filter(c => c.id !== id); ui.recipe = RECIPES[0].id; save(); render(); }
});

document.getElementById("app").addEventListener("input", e => {
  const t = e.target, a = t.dataset.act; if(!a) return;
  if(a === "date")   { S.steps[ui.step].date = t.value; save(); }
  else if(a === "result") { S.steps[ui.step].result = t.value; save(); }
  else if(a === "memo")   { S.memos[t.dataset.id] = t.value; save(); }
  else if(a === "cname")  { const c = S.custom.find(x => x.id === t.dataset.id); if(c){ c.name = t.value; save(); } }
  else if(a === "cbody")  { const c = S.custom.find(x => x.id === t.dataset.id); if(c){ c.body = t.value; save(); } }
  else if(a === "tr"){
    const tr = S.steps[ui.step].trouble.find(x => String(x.id) === t.dataset.id);
    if(tr){ tr[t.dataset.f] = t.value; save(); }
  }
  else if(a === "ed-name"){ ui.editor.name = t.value; }
  else if(a === "ed-note"){ ui.editor.note = t.value; }
  else if(a === "ed-text"){ ui.editor.text = t.value; }
  else if(a === "cap"){
    const arr = (pics[ui.step]||[]).map(p => p.id === t.dataset.id ? { ...p, caption:t.value } : p);
    clearTimeout(window.__capT);
    pics[ui.step] = arr;
    window.__capT = setTimeout(() => savePics(ui.step, arr), 500);
  }
});

document.getElementById("app").addEventListener("change", e => {
  if(e.target.dataset.act === "ed-phase"){ ui.editor.phase = e.target.value; return; }
  if(e.target.id === "docinput"){
    const el = e.target, f = (el.files || [])[0];
    if(f) importDoc(f).then(() => { el.value = ""; });
    return;
  }
  if(e.target.id === "picinput"){
    const el = e.target, files = Array.from(el.files || []);
    addPics(ui.step, files).then(() => { el.value = ""; });
  }
});

document.getElementById("app").addEventListener("dragover", e => {
  const d = e.target.closest("#drop, #impdrop"); if(!d) return;
  e.preventDefault(); d.classList.add("over");
});
document.getElementById("app").addEventListener("dragleave", e => {
  const d = e.target.closest("#drop, #impdrop"); if(d) d.classList.remove("over");
});
document.getElementById("app").addEventListener("drop", e => {
  const i = e.target.closest("#impdrop");
  if(i){ e.preventDefault(); i.classList.remove("over"); const f = (e.dataTransfer.files||[])[0]; if(f) importDoc(f); return; }
  const d = e.target.closest("#drop"); if(!d) return;
  e.preventDefault(); d.classList.remove("over");
  addPics(ui.step, e.dataTransfer.files);
});

function lightbox(p){
  const w = document.createElement("div");
  w.className = "lbox";
  w.innerHTML = `<img src="${p.data}" alt="${esc(p.caption||p.name)}">${p.caption?`<p>${esc(p.caption)}</p>`:""}<button>닫기 ×</button>`;
  const close = () => { w.remove(); document.removeEventListener("keydown", key); };
  const key = ev => ev.key === "Escape" && close();
  w.addEventListener("click", close);
  document.addEventListener("keydown", key);
  document.body.appendChild(w);
}

document.getElementById("menu").addEventListener("click", () => {
  const w = document.createElement("div");
  w.className = "sheet";
  const where = { idb:"기기 내부 저장소(IndexedDB)", local:"브라우저 저장소(localStorage)", memory:"저장 안 됨 — 새로고침하면 사라집니다" }[Store.mode];
  w.innerHTML = `<div class="card">
    <h3>기록 관리</h3><p class="sub">기록은 이 기기에만 저장됩니다.</p>
    <button class="row" data-x="export">기록 내보내기 (JSON 백업)</button>
    <button class="row" data-x="import">백업 불러오기</button>
    <input type="file" accept="application/json,.json" id="impfile" style="display:none">
    <p class="stat">저장 위치 · ${esc(where)}<br>단계 ${allSteps().length}개 · 사진 ${allSteps().reduce((n,s)=>n+((S.steps[s.id]||{}).photoN||0),0)}장</p>
    <button class="row close" data-x="close">닫기</button></div>`;
  w.addEventListener("click", async e => {
    if(e.target === w) return w.remove();
    const b = e.target.closest("[data-x]"); if(!b) return;
    if(b.dataset.x === "close") w.remove();
    if(b.dataset.x === "export"){ await exportAll(); w.remove(); }
    if(b.dataset.x === "import") w.querySelector("#impfile").click();
  });
  w.addEventListener("change", async e => {
    if(e.target.id !== "impfile" || !e.target.files[0]) return;
    try{ await importAll(e.target.files[0]); w.remove(); flag("saved"); }
    catch(err){ alert("불러오지 못했습니다: " + err.message); }
  });
  document.body.appendChild(w);
});

/* ══ 시작 ══ */
(async () => {
  await Store.init();
  let init = null;
  try{ init = await Store.get(KEY); }catch(e){}
  S = init || S;
  S.steps = S.steps || {}; S.memos = S.memos || {}; S.custom = S.custom || []; S.customSteps = S.customSteps || [];
  allSteps().forEach(s => { S.steps[s.id] = { ...blank(), ...(S.steps[s.id] || {}) }; });
  render();
})();
</script>
</body>
</html>
