<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실험 프로토콜 · 노트</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="실험 노트">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%233a6b5f'/%3E%3Cpath d='M70 38h40v46l30 52a12 12 0 0 1-10 18H50a12 12 0 0 1-10-18l30-52z' fill='none' stroke='%23fbfaf7' stroke-width='9' stroke-linejoin='round'/%3E%3Cpath d='M58 108h64' stroke='%23fbfaf7' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ui:-apple-system,'Segoe UI',system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo',monospace;
  --paper:#f3f1ec; --card:#fbfaf7; --line:#dcd7cc;
  --ink:#26241f; --ink-soft:#6b675d; --accent:#3a6b5f;
  --st-todo:#a8a29a; --st-run:#c98a2b; --st-done:#3a8f6a; --st-fail:#c0503f;
  --tap:46px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(58,107,95,.12)}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;overscroll-behavior-y:none;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none !important}

/* ── 상단바 ─────────────────────────────── */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(var(--top) + 10px) 16px 0;}
.hrow{display:flex;align-items:center;gap:12px;}
.htitle{flex:1;min-width:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);}
h1{margin:1px 0 0;font-size:19px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.save{font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding:5px 10px;border:1px solid var(--line);border-radius:20px;background:var(--card);white-space:nowrap;}
.save.saved{color:var(--st-done);border-color:var(--st-done)}
.save.error{color:var(--st-fail);border-color:var(--st-fail)}
.iconbtn{width:var(--tap);height:var(--tap);flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;background:none;border:1px solid var(--line);border-radius:11px;background:var(--card);}
.tabs{display:flex;gap:2px;margin-top:8px;}
@media(max-width:600px){h1{font-size:17px}}
.tab{min-height:var(--tap);padding:0 18px;font-size:15px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-bottom:2.5px solid transparent;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ── 본문 레이아웃 ───────────────────────── */
main{padding:16px 16px calc(28px + var(--bot));max-width:1400px;margin:0 auto;}
.split{display:grid;grid-template-columns:1fr;gap:18px;align-items:start;}
@media(min-width:900px){
  .split{grid-template-columns:320px 1fr;}
  .backbtn{display:none}
  .pane-list,.pane-detail{display:block !important}
}
@media(max-width:899px){
  .split.detail-mode .pane-list{display:none}
  .split:not(.detail-mode) .pane-detail{display:none}
}
.backbtn{min-height:var(--tap);display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;padding:0 15px 0 11px;font-size:14px;font-weight:600;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:11px;}

/* ── 진행 배너 · 진행률 ──────────────────── */
.now{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:12px;padding:13px 15px;border-radius:11px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--st-todo);}
.now.set{border-left-color:var(--st-run);background:#fbf3e4}
.now .dot{width:11px;height:11px;border-radius:50%;background:var(--st-run);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,138,43,.5)}70%{box-shadow:0 0 0 9px rgba(201,138,43,0)}100%{box-shadow:0 0 0 0 rgba(201,138,43,0)}}
@media(prefers-reduced-motion:reduce){.now .dot{animation:none}}
.now .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--st-run);text-transform:uppercase}
.now .nm{font-size:16px;font-weight:650;background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--st-run)}
.now .ph{font-size:13px;color:var(--ink-soft)}
.now .empty{font-size:14px;color:var(--ink-soft);font-style:italic}
.bar{position:relative;height:30px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3a8f6a,#4aa87e);transition:width .4s ease}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;mix-blend-mode:luminosity}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--ink-soft)}
.legend b{display:inline-flex;align-items:center;gap:6px;font-weight:400}
.legend b i,.chip i,.node .sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* ── 목록 ───────────────────────────────── */
.group{margin-bottom:18px}
.group>h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink-soft);padding-left:2px}
.node{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:8px;font-size:15px;}
.node.on{border-color:var(--accent);background:#eef3f1;box-shadow:inset 3px 0 0 var(--accent)}
.node.cur{border-color:var(--st-run);background:#fbf3e4;box-shadow:inset 3px 0 0 var(--st-run)}
.node .nm{flex:1}
.node .sdot{background:var(--st-todo)}
.node.st-running .sdot{background:var(--st-run)}
.node.st-done .sdot{background:var(--st-done)}
.node.st-failed .sdot{background:var(--st-fail)}
.badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:10px;flex:none}
.badge.here{background:var(--st-run);color:#fff}
.badge.pic{color:var(--accent);border:1px solid var(--line)}
.badge.flag{color:var(--st-fail)}
.addnode{width:100%;min-height:var(--tap);font-size:14px;color:var(--accent);background:none;border:1px dashed var(--line);border-radius:11px}

/* ── 상세 ───────────────────────────────── */
.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.dhead{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dphase{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.05em}
.detail h2{margin:8px 0 5px;font-size:22px;font-weight:640}
.dnote{margin:0;font-size:14px;color:var(--ink-soft)}
.herebtn{min-height:var(--tap);padding:0 16px;font-size:13.5px;font-weight:600;color:var(--st-run);background:none;border:1px solid var(--st-run);border-radius:23px}
.herebtn.on{background:var(--st-run);color:#fff}
.delbtn{min-height:var(--tap);padding:0 16px;font-size:13.5px;color:var(--st-fail);background:none;border:1px solid var(--line);border-radius:23px}
.field{margin-bottom:22px}
.field>label,.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:9px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.frow label{margin:0}
.toggle{min-height:38px;padding:0 12px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:8px}
.addbtn{min-height:40px;padding:0 15px;font-size:13.5px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:9px}
.empty{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin:4px 0 0}

/* 프로토콜 */
.proto{margin:0;padding:0;list-style:none;counter-reset:p}
.proto li{position:relative;counter-increment:p;padding:9px 4px 9px 42px;font-size:15px;line-height:1.6;border-bottom:1px dashed var(--line)}
.proto li::before{content:counter(p);position:absolute;left:6px;top:9px;font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--paper);border:1px solid var(--line);border-radius:6px;width:24px;height:22px;display:flex;align-items:center;justify-content:center}
.proto li:last-child{border-bottom:none}
.proto li.k-sub{counter-increment:none;background:#eef3f1;font-weight:600;color:var(--accent);padding:8px 12px;border-radius:7px;margin:11px 0 6px;border-bottom:none}
.proto li.k-sub::before{display:none}
.proto li.k-lead{counter-increment:none;padding:11px 14px;font-size:15.5px;font-weight:650;color:var(--ink);background:#eef3f1;border-left:4px solid var(--accent);border-radius:7px;border-bottom:none;margin:0 0 12px}
.proto li.k-lead::before{display:none}
.proto li.k-item{counter-increment:none;padding:4px 4px 4px 42px;border-bottom:none}
.proto li.k-item::before{content:"–";border:none;background:none;color:var(--ink-soft);width:auto;height:auto;left:24px;top:4px;font-size:15px}
.proto li.k-note{counter-increment:none;padding:2px 4px 8px 42px;font-size:14px;color:var(--ink-soft);border-bottom:none}
.proto li.k-note::before{display:none}
.proto li.k-warn{counter-increment:none;padding:8px 12px;font-size:14px;font-weight:600;color:var(--st-fail);background:rgba(192,80,63,.07);border-radius:7px;border-bottom:none;margin:6px 0}
.proto li.k-warn::before{display:none}

/* 표 */
table.rt{width:100%;border-collapse:collapse;font-size:15px}
table.rt th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);padding:9px 11px;background:#eef3f1;border-bottom:1px solid var(--line)}
table.rt td{padding:10px 11px;border-bottom:1px dashed var(--line);vertical-align:top}
table.rt tr:last-child td{border-bottom:none}
table.rt td:first-child{font-weight:600}
table.rt td:not(:first-child){font-family:var(--mono);font-size:14px}
ul.rnotes{margin:0;padding-left:19px}
ul.rnotes li{font-size:14.5px;color:var(--ink-soft);margin-bottom:6px}

/* 입력 */
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 16px;font-size:14px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:23px}
.chip.on{font-weight:600;background:var(--card)}
input[type=date],input[type=text],textarea{width:100%;font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 13px}
input[type=date]{min-height:var(--tap)}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,107,95,.13)}
.titlein{width:100%;margin-top:8px;font-size:21px;font-weight:640;background:none;border:none;border-bottom:1px dashed var(--line);padding:3px 0;border-radius:0}

/* 트러블슈팅 */
.tr{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--st-fail);border-radius:10px;padding:12px;margin-bottom:10px}
.tr .n{font-family:var(--mono);font-size:13px;color:var(--st-fail);font-weight:600;padding-top:12px}
.tr .f{flex:1;display:flex;flex-direction:column;gap:8px}
.tr .x{width:var(--tap);height:var(--tap);flex:none;font-size:22px;color:var(--ink-soft);background:none;border:none;border-radius:9px}

/* 사진 */
.drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:11px;padding:12px 14px;background:var(--paper)}
.drop.over{border-color:var(--accent);background:#eef3f1}
.drop input[type=file]{display:none}
.picbtn{min-height:var(--tap);padding:0 18px;font-size:14.5px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px}
.picbtn[disabled]{opacity:.6}
.drophint{font-size:13.5px;color:var(--ink-soft)}
.picerr{font-size:13.5px;color:var(--st-fail);margin:9px 0 0}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px;margin-top:13px}
.pic{position:relative;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.pic .thumb{display:block;width:100%;height:132px;padding:0;border:none;background:#e6e2da}
.pic .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pic .x{position:absolute;top:6px;right:6px;width:34px;height:34px;font-size:19px;line-height:1;color:#fff;background:rgba(38,36,31,.62);border:none;border-radius:50%}
.pic figcaption{padding:8px}
.pic figcaption input{font-size:14px;padding:8px 9px;background:var(--card)}

/* 확대 · 시트 */
.lbox{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + var(--top)) 22px calc(24px + var(--bot));background:rgba(24,22,19,.88)}
.lbox img{max-width:100%;max-height:74vh;border-radius:8px}
.lbox p{margin:0;font-size:15px;color:#f3f1ec;text-align:center}
.lbox button{min-height:var(--tap);padding:0 20px;font-size:14px;color:#f3f1ec;background:none;border:1px solid rgba(243,241,236,.55);border-radius:23px}
.sheet{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;background:rgba(24,22,19,.45)}
.sheet .card{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + var(--bot))}
@media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sub{margin:0 0 16px;font-size:13.5px;color:var(--ink-soft)}
.sheet button.row{display:block;width:100%;min-height:52px;text-align:left;padding:0 16px;margin-bottom:9px;font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:11px}
.sheet .close{color:var(--ink-soft);text-align:center}
select{width:100%;min-height:var(--tap);font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:0 12px}
.dtopbtns{display:flex;gap:8px;flex-wrap:wrap}
.edrow{display:flex;gap:10px;flex-wrap:wrap}
.edrow .addbtn,.edrow .delbtn{min-height:var(--tap);padding:0 22px;font-size:15px}
.btnpair{display:flex;gap:6px}
.prevbox li[data-act]{cursor:pointer;border-radius:6px}
.prevbox li[data-act]:active{background:#eef3f1}
.prevbox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 12px;max-height:340px;overflow:auto}
.prevbox:empty{display:none}
.rule{margin-top:10px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.85;color:var(--ink-soft)}
.rule b{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600}
.sheet input[type=text],.sheet input[type=email],.sheet input[type=password]{width:100%;font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 13px;min-height:var(--tap)}
.calcbox{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px}
.csub{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.calcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.calcgrid label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.calcgrid .cu{font-family:var(--mono);font-size:11px}
.calcgrid input{width:100%;min-height:var(--tap);font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:0 12px}
@media(max-width:420px){.calcgrid{grid-template-columns:1fr}}
.hdtimer{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;padding:7px 12px;border:1px solid var(--st-run);color:var(--st-run);background:#fbf3e4;border-radius:20px;cursor:pointer;white-space:nowrap;max-width:230px;overflow:hidden}
.hdtimer.done{border-color:var(--st-done);color:var(--st-done);background:#e9f4ee}
.hdtimer b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.hdname{font-family:var(--ui);font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.hdmore{font-size:11px;opacity:.75}
@media(max-width:600px){.hdname{display:none}}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subtab{min-height:42px;padding:0 16px;font:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:22px;cursor:pointer}
.subtab.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.hint{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft)}
.pair{display:flex;gap:8px}
.pair select{max-width:118px;flex:none;min-height:var(--tap);font:inherit;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:0 9px}
.pair input.solved{background:#eef3f1;border-color:var(--accent)}
.out{margin-top:14px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:11px}
.big{font-family:var(--mono);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums}
.note{margin:9px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);line-height:1.6}
.card2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.card2 .field:last-child{margin-bottom:0}
.badge.run{color:var(--accent);border:1px solid var(--line)}
.runbox{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden;background:var(--paper)}
.runbox.open{border-color:var(--accent);background:var(--card)}
.runhead{display:flex;align-items:center;gap:9px;width:100%;min-height:var(--tap);padding:10px 13px;font:inherit;font-size:14px;text-align:left;background:none;border:none;cursor:pointer;border-left:4px solid var(--st-todo)}
.runhead.st-running{border-left-color:var(--st-run)}
.runhead.st-done{border-left-color:var(--st-done)}
.runhead.st-failed{border-left-color:var(--st-fail)}
.runhead.on{background:#eef3f1}
.rnum{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent)}
.rdate{font-family:var(--mono);font-size:12.5px}
.rstat{flex:1;font-size:12.5px;color:var(--ink-soft)}
.rchev{font-size:10px;color:var(--ink-soft)}
.runbody{padding:4px 14px 14px;border-top:1px solid var(--line)}
.runbody .field:last-child{margin-bottom:0}
.tr .f input[type=date]{max-width:190px}
.tgrid3{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}
.tgrid3 label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.tgrid3 input{width:100%;min-height:var(--tap);font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:0 12px}
@media(max-width:520px){.tgrid3{grid-template-columns:1fr 1fr}.tgrid3>div:last-child{grid-column:1/-1}}
.tcard{border:1px solid var(--line);border-left:4px solid var(--st-todo);border-radius:11px;padding:13px;margin-top:12px;background:var(--paper)}
.tcard.run{border-left-color:var(--st-run);background:#fbf3e4}
.tcard.done{border-left-color:var(--st-done);background:#e9f4ee}
.trow{display:flex;align-items:center;gap:8px}
.trow input{flex:1;background:transparent;border:none;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;font-size:14.5px;font-weight:600}
.trow input:focus{border-bottom-color:var(--accent);box-shadow:none}
.tclock{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 2px}

   기본 묶음은 이름만 바꿀 수 있고, 사용자가 추가한 묶음은 지울 수도 있다. */
function groupsFlow(){
  const built = PHASES.map(p => ({ id:p.id, label:(S.phaseNames || {})[p.id] || p.label, built:true }));
  const extra = (S.phaseExtra || []).map(g => ({ id:g.id, label:g.label, built:false }));
  return built.concat(extra);
}
function groupsPrep(){
  const nm = S.catNames || {};
  const built = RECIPE_CATS.map(c => ({ id:c.id, label:nm[c.id] || c.label, built:true }));
  built.push({ id:"mine", label:nm.mine || "내가 추가한 것", built:true });
  const extra = (S.catExtra || []).map(g => ({ id:g.id, label:g.label, built:false }));
  return built.concat(extra);
}
function phaseList(){
  const gs = groupsFlow();
  const mine = S.customSteps || [];
  const out = gs.map(g => {
    const base = PHASES.find(p => p.id === g.id);
    return { id:g.id, label:g.label, steps:(base ? base.steps : []).concat(mine.filter(c => c.phase === g.id)) };
  });
  const orphan = mine.filter(c => !gs.some(g => g.id === c.phase));
  if(orphan.length) out.push({ id:"etc", label:"기타", steps:orphan });
  return out;
}
function prepList(){
  const gs = groupsPrep();
  const mine = S.custom || [];
  const out = gs.map(g => ({
    id:g.id, label:g.label,
    items: RECIPES.filter(r => r.cat === g.id).map(r => ({ mine:false, id:r.id, name:r.name }))
      .concat(mine.filter(c => (c.cat || "mine") === g.id).map(c => ({ mine:true, id:c.id, name:c.name }))),
  }));
  const orphan = mine.filter(c => !gs.some(g => g.id === (c.cat || "mine")));
  if(orphan.length) out.push({ id:"etc", label:"기타", items:orphan.map(c => ({ mine:true, id:c.id, name:c.name })) });
  return out;
}
function allSteps(){ return phaseList().flatMap(p => p.steps.map(s => ({ ...s, phaseLabel:p.label }))); }
function STEP(id){ return allSteps().find(s => s.id === id); }
function isMine(id){ return (S.customSteps || []).some(c => c.id === id); }

/* ══ 저장소 — IndexedDB → localStorage → 메모리 ══ */
const Store = (() => {
  let mode = "memory", db = null, mem = {};
  const wrap = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
  async function init(){
    try{
      if(!self.indexedDB) throw 0;
      db = await new Promise((res, rej) => {
        const rq = indexedDB.open("lab_tracker", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
        rq.onsuccess = () => res(rq.result);
        rq.onerror   = () => rej(rq.error);
        rq.onblocked = () => rej(new Error("blocked"));
        setTimeout(() => rej(new Error("timeout")), 4000);
      });
      mode = "idb"; return mode;
    }catch(e){}
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); mode = "local"; }
    catch(e){ mode = "memory"; }
    return mode;
  }
  async function get(k){
    if(mode === "idb"){ const v = await wrap(db.transaction("kv","readonly").objectStore("kv").get(k)); return v === undefined ? null : v; }
    if(mode === "local"){ const v = localStorage.getItem(k); return v === null ? null : JSON.parse(v); }
    return k in mem ? mem[k] : null;
  }
  async function set(k, v){
    if(mode === "idb") return wrap(db.transaction("kv","readwrite").objectStore("kv").put(v, k));
    if(mode === "local") return localStorage.setItem(k, JSON.stringify(v));
    mem[k] = v;
  }
  async function keys(){
    if(mode === "idb") return wrap(db.transaction("kv","readonly").objectStore("kv").getAllKeys());
    if(mode === "local") return Object.keys(localStorage);
    return Object.keys(mem);
  }
  async function del(k){
    if(mode === "idb") return wrap(db.transaction("kv","readwrite").objectStore("kv").delete(k));
    if(mode === "local") return localStorage.removeItem(k);
    delete mem[k];
  }
  return { init, get, set, keys, del, get mode(){ return mode; } };
})();

/* ══ Supabase 동기화 ══════════════════════════════════════
   SDK 없이 REST API만 호출한다 (파일 하나 유지).
   아래 두 값을 채워 넣으면 모든 기기가 같은 설정을 쓴다. 비워두면 앱 안에서 입력할 수 있다.
   anon key 는 공개되어도 되는 값이고, 실제 보호는 Supabase 쪽 RLS 정책이 한다. */
const SUPA_BUILTIN = { url:"", key:"" };

/* 붙여넣은 주소를 API 주소로 바로잡는다.
   대시보드 주소, project ref, 뒤에 붙은 경로 모두 받아준다. */
function normUrl(v){
  let u = (v || "").trim().replace(/\s+/g, "");
  if(!u) return "";
  const dash = u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  if(dash) return "https://" + dash[1] + ".supabase.co";
  if(/^[a-z0-9]{12,}$/i.test(u)) return "https://" + u + ".supabase.co";
  if(!/^https?:\/\//i.test(u)) u = "https://" + u;
  try{ return new URL(u).origin; }catch(e){ return u.replace(/\/+$/, ""); }
}
function urlWarning(u){
  if(!u) return "주소를 넣어 주세요.";
  if(/supabase\.com$/i.test(new URL(u).host)) return "대시보드 주소가 아니라 프로젝트 API 주소가 필요합니다. Project Settings → API 의 Project URL 을 복사하세요.";
  return "";
}
function supaReady(){ return !!(supa.url && supa.key); }
function signedIn(){ return !!(supa.access && supa.uid); }

async function supaLoad(){
  const cfg = (await Store.get(CFG_K)) || {};
  supa.url = (cfg.url || SUPA_BUILTIN.url || "").replace(/\/+$/, "");
  supa.key = cfg.key || SUPA_BUILTIN.key || "";
  const tok = (await Store.get(TOK_K)) || {};
  Object.assign(supa, { access:tok.access||"", refresh:tok.refresh||"", expires:tok.expires||0, uid:tok.uid||"", email:tok.email||"" });
}
async function supaSaveTok(){
  await Store.set(TOK_K, { access:supa.access, refresh:supa.refresh, expires:supa.expires, uid:supa.uid, email:supa.email });
}
async function api(path, opts = {}){
  const h = Object.assign({ "apikey":supa.key, "Content-Type":"application/json" }, opts.headers || {});
  if(supa.access && !opts.noAuth) h["Authorization"] = "Bearer " + supa.access;
  const r = await fetch(supa.url + path, { method:opts.method || "GET", headers:h, body:opts.body ? JSON.stringify(opts.body) : undefined });
  const txt = await r.text();
  let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    let m = (j && (j.msg || j.message || j.error_description || j.error)) || ("서버 오류 " + r.status);
    if(r.status === 404 || /invalid path/i.test(txt || "")) m += " — 주소가 프로젝트 API 주소인지 확인하세요 (https://xxxx.supabase.co)";
    throw new Error(m);
  }
  return j;
}
async function setSession(j, email){
  if(!j || !j.access_token) throw new Error("로그인 응답에 토큰이 없습니다");
  supa.access = j.access_token; supa.refresh = j.refresh_token || "";
  supa.expires = Date.now() + (j.expires_in || 3600) * 1000;
  supa.uid = (j.user && j.user.id) || (j.id) || supa.uid;
  supa.email = email || supa.email;
  await supaSaveTok();
}
/* 비밀번호 방식 — 이메일 템플릿을 못 고치는 프로젝트에서도 된다 */
async function signUpPw(email, password){
  const j = await api("/auth/v1/signup", { method:"POST", noAuth:true, body:{ email, password } });
  if(j && j.access_token){ await setSession(j, email); return "in"; }
  return "confirm";
}
async function signInPw(email, password){
  const j = await api("/auth/v1/token?grant_type=password", { method:"POST", noAuth:true, body:{ email, password } });
  await setSession(j, email);
}
/* 이메일 코드 방식 — 숫자 코드도, 메일에 온 링크를 통째로 붙여넣어도 받는다 */
async function sendCode(email){
  await api("/auth/v1/otp", { method:"POST", noAuth:true, body:{ email, create_user:true } });
}
async function verifyCode(email, input){
  const raw = (input || "").trim();
  let body;
  if(/^https?:\/\//i.test(raw) || raw.includes("token=")){
    const m = raw.match(/[?&]token=([^&\s]+)/);
    if(!m) throw new Error("링크에서 토큰을 찾지 못했습니다");
    const ty = raw.match(/[?&]type=([^&\s]+)/);
    body = { token_hash: decodeURIComponent(m[1]), type: ty ? ty[1] : "magiclink" };
  }else{
    body = { email, token: raw.replace(/\s/g, ""), type:"email" };
  }
  const j = await api("/auth/v1/verify", { method:"POST", noAuth:true, body });
  await setSession(j, email);
}
async function ensureAuth(){
  if(!signedIn()) throw new Error("로그인이 필요합니다");
  if(Date.now() < supa.expires - 60000) return;
  const j = await api("/auth/v1/token?grant_type=refresh_token", { method:"POST", noAuth:true, body:{ refresh_token:supa.refresh } });
  supa.access = j.access_token; supa.refresh = j.refresh_token || supa.refresh;
  supa.expires = Date.now() + (j.expires_in || 3600) * 1000;
  await supaSaveTok();
}
async function signOut(){
  supa.access = ""; supa.refresh = ""; supa.expires = 0; supa.uid = ""; supa.email = "";
  await supaSaveTok();
}

/* 키마다 마지막으로 바뀐 시각을 남겨 새 쪽이 이기게 한다 */
async function touch(k){
  const m = (await Store.get(META_K)) || {};
  m[k] = Date.now();
  await Store.set(META_K, m);
  scheduleSync();
}
let syncTimer = null;
function scheduleSync(){
  if(!supaReady() || !signedIn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(true), 4000);
}
function typing(){
  const a = document.activeElement;
  return !!(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"));
}

async function syncNow(silent){
  if(!supaReady() || !signedIn() || syncState.busy) return;
  syncState.busy = true; syncState.msg = "동기화 중…"; if(!silent) refreshSheet();
  try{
    await ensureAuth();
    const meta = (await Store.get(META_K)) || {};
    const remote = await api("/rest/v1/lab_kv?select=k,v,updated_at");
    const rmap = {}; (remote || []).forEach(r => rmap[r.k] = r);
    let pulled = 0, pushed = 0;

    for(const r of (remote || [])){
      const rt = new Date(r.updated_at).getTime();
      if(rt > (meta[r.k] || 0)){
        if(r.k === KEY && typing()) continue;      // 입력 중이면 본문은 나중에 받는다
        await Store.set(r.k, r.v); meta[r.k] = rt; pulled++;
      }
    }
    const keys = [KEY];
    allSteps().forEach(x => stepEntry(x.id).runs.forEach(r => keys.push(PKEY(x.id, r.id))));
    for(const k of keys){
      const lt = meta[k] || 0;
      const rt = rmap[k] ? new Date(rmap[k].updated_at).getTime() : 0;
      if(lt > rt){
        const v = await Store.get(k);
        if(v == null) continue;
        const row = await api("/rest/v1/lab_kv?on_conflict=user_id,k", {
          method:"POST",
          headers:{ "Prefer":"resolution=merge-duplicates,return=representation" },
          body:[{ user_id:supa.uid, k, v }],
        });
        if(row && row[0]) meta[k] = new Date(row[0].updated_at).getTime();
        pushed++;
      }
    }
    await Store.set(META_K, meta);
    syncState.at = Date.now();
    syncState.msg = pulled || pushed ? `받음 ${pulled} · 보냄 ${pushed}` : "최신 상태";
    if(pulled){
      const fresh = await Store.get(KEY);
      if(fresh && !typing()){
        S = fresh;
        S.steps = S.steps || {}; S.memos = S.memos || {}; S.custom = S.custom || []; S.customSteps = S.customSteps || []; S.calc = S.calc || { ...CALC_DEF };
  S.timers = S.timers || []; S.dil = S.dil || { ...DIL_DEF };
  S.phaseNames = S.phaseNames || {}; S.phaseExtra = S.phaseExtra || [];
  S.catNames = S.catNames || {}; S.catExtra = S.catExtra || [];
        allSteps().forEach(x => stepEntry(x.id));
      }
      pics = {};
      render();
    }
  }catch(e){
    syncState.msg = "실패: " + (e.message || e);
  }
  syncState.busy = false;
  refreshSheet();
}

  let e = S.steps[id];
  if(!e || !Array.isArray(e.runs)){
    const had = e && (e.status && e.status !== "todo" || e.date || e.result || (e.trouble || []).length || e.photoN);

/* ══ 프로토콜 줄 해석 ══
   "-" 로 시작하는 줄만 번호 없는 나열이 된다. 소제목 아래라고 해서 자동으로 나열이 되지는 않는다. */
const LIST_HEAD = /재료|준비물|material/i;
const AUTO_HEAD = /^\[\s*(과정|진행|방법|순서)\s*\]$/;
function parseProtocol(lines){
  return lines.map(l => {
    if(l.startsWith("[")) return { k:"sub",  t:l };
    if(l.startsWith(">")) return { k:"lead", t:l.replace(/^>\s*/, "") };
    if(l.startsWith("★")) return { k:"warn", t:l };
    if(l.startsWith("(") || l.startsWith("※")) return { k:"note", t:l };
    if(l.startsWith("-")) return { k:"item", t:l.replace(/^-\s*/, "") };
    return { k:"step", t:l };
  });
}
/* 재료 칸과 과정 칸을 하나의 프로토콜로 합친다 */
function joinLines(){
  const e = ui.editor;
  const mats = (e.mats || "").split(/\r?\n/).map(x => x.trim().replace(/^-\s*/, "")).filter(Boolean);
  const proc = (e.text || "").split(/\r?\n/);
  const out = [];
  if(mats.length){
    out.push({ t:"[재료]", i:-1 });
    mats.forEach(m => out.push({ t:"- " + m, i:-1 }));
    const first = proc.map(x => x.trim()).find(Boolean);
    if(first && !first.startsWith("[")) out.push({ t:"[과정]", i:-1 });
  }
  proc.forEach((l, i) => { const t = l.trim(); if(t) out.push({ t, i }); });
  return out;
}
/* 저장된 프로토콜을 다시 두 칸으로 나눈다 (편집·불러오기용) */
function splitProtocol(lines){
  const mats = [], proc = [];
  let mode = "proc", used = false;
  for(const l of lines){
    if(l.startsWith("[")){
      if(!used && LIST_HEAD.test(l)){ mode = "mat"; used = true; continue; }
      mode = "proc";
      if(AUTO_HEAD.test(l.trim())) continue;
      proc.push(l); continue;
    }
    if(mode === "mat") mats.push(l.replace(/^-\s*/, ""));
    else proc.push(l);
  }
  return { mats, proc };
}


/* ══ Ligation 계산기 ══
   vector 1 µl 기준 상대 몰수로 insert 필요량을 구한 뒤 DNA 부피를 배분한다.
     vector mole = vC / vBp
     insert ng   = vector mole × ratio × iBp     (vector 1 µl 당)
     insert µl   = insert ng / iC
     vector µl   = DNA 부피 / (1 + insert µl),  insert µl = DNA 부피 − vector µl
   남는 부피는 D.W. 로 채운다. */
const TOOLS = { lig:"ligation" };
const CALC_DEF = { vlen:5369, vconc:10, ilen:1200, iconc:5, ratio:3, dna:8, total:10, buffer:1, ligase:1 };

function calcLig(c){
  const n = v => (isFinite(parseFloat(v)) ? parseFloat(v) : NaN);
  const vBp = n(c.vlen), iBp = n(c.ilen), vC = n(c.vconc), iC = n(c.iconc);
  const R = n(c.ratio), dv = n(c.dna), tv = n(c.total), buf = n(c.buffer), lig = n(c.ligase);
  if(![vBp, iBp, vC, iC, R, dv].every(v => isFinite(v) && v > 0)) return null;
  if(!isFinite(tv) || !isFinite(buf) || !isFinite(lig)) return null;
  const vMole   = vC / vBp;
  const iNgPer  = vMole * R * iBp;
  const iUlPer  = iNgPer / iC;
  const Vv = dv / (1 + iUlPer);
  const Vi = dv - Vv;
  const water = tv - dv - buf - lig;
  return { vMole, iNgPer, iUlPer, Vv, Vi, water, dv, tv, buf, lig,
           ngV:Vv * vC, ngI:Vi * iC, vBp, iBp, vC, iC, R };
}
function ligHTML(){
  const c = S.calc || CALC_DEF;
  const f = (id, label, unit) =>
    `<div><label for="c_${id}">${label}${unit?` <span class="cu">${unit}</span>`:""}</label>
      <input id="c_${id}" type="text" inputmode="decimal" value="${esc(c[id])}" data-act="calc" data-f="${id}"></div>`;
  return `<div class="field">
    <div class="frow"><span class="flabel" style="margin:0">Ligation 계산기</span>
      <button class="toggle" data-act="calc-reset">예제 값으로</button></div>
    <div class="calcbox">
      <p class="csub">Vector</p>
      <div class="calcgrid">${f("vlen","길이","bp")}${f("vconc","농도","ng/µl")}</div>
      <p class="csub">Insert</p>
      <div class="calcgrid">${f("ilen","길이","bp")}${f("iconc","농도","ng/µl")}</div>
      <p class="csub">반응 조건</p>
      <div class="calcgrid">${f("ratio","몰비 vector : insert = 1 : n","n")}${f("dna","DNA 부피 (vector+insert)","µl")}</div>
      <div class="calcgrid">${f("total","총 반응 부피","µl")}${f("buffer","10X ligase buffer","µl")}</div>
      <div class="calcgrid">${f("ligase","T4 DNA ligase","µl")}<div></div></div>
      <div id="ligout">${ligOutHTML()}</div>
    </div>
  </div>`;
}
function ligOutHTML(){
  const c = S.calc || CALC_DEF;

  const f = (v, d = 2) => v.toFixed(d);
  const rows = [

  if(r.water > 0.001) rows.push(["D.W.", f(r.water) + " µl", "—"]);

/* ══ 프로토콜 문서 불러오기 ══
   hwpx / docx 는 ZIP + XML 이라 브라우저에서 바로 풀 수 있다. 외부 라이브러리 없음. */
async function unzip(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("압축 파일 구조를 읽지 못했습니다");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const out = {};
  for(let i = 0; i < count; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = dec.decode(buf.subarray(off + 46, off + 46 + nlen));
    const lnlen  = dv.getUint16(lho + 26, true);
    const lelen  = dv.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    out[name] = { method, data: buf.subarray(start, start + csize) };
    off += 46 + nlen + elen + clen;
  }
  return out;
}
async function inflate(entry){
  if(entry.method === 0) return entry.data;
  if(typeof DecompressionStream === "undefined")
    throw new Error("이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome이나 Safari에서 열어 주세요.");
  const stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/* 문단 단위로 글자만 뽑는다. 표 안의 문단은 칸별로 한 줄이 된다. */
function paragraphs(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.querySelector("parsererror")) return [];
  const out = [];
  const ps = Array.from(doc.getElementsByTagName("*")).filter(e => e.localName === "p");
  for(const p of ps){
    if(Array.from(p.getElementsByTagName("*")).some(c => c.localName === "p")) continue; // 바깥 문단은 건너뛰어 중복 방지
    const t = Array.from(p.getElementsByTagName("*"))
      .filter(c => c.localName === "t").map(c => c.textContent).join("");
    out.push(t);
  }
  return out;
}
async function readDoc(file){
  const nm = (file.name || "").toLowerCase();
  if(nm.endsWith(".txt") || nm.endsWith(".md")) return (await file.text()).split(/\r?\n/);
  if(nm.endsWith(".hwp")) throw new Error("구형 .hwp 는 읽지 못합니다. 한글에서 .hwpx 로 저장한 뒤 다시 넣어 주세요.");
  const files = await unzip(file);
  let targets = Object.keys(files).filter(n => /^Contents\/section\d+\.xml$/i.test(n)).sort();
  if(!targets.length && files["word/document.xml"]) targets = ["word/document.xml"];
  if(!targets.length) throw new Error("hwpx · docx · txt 파일만 읽을 수 있습니다");
  const lines = [];
  const dec = new TextDecoder();
  for(const t of targets) lines.push(...paragraphs(dec.decode(await inflate(files[t]))));
  return lines;
}
/* 뽑은 줄을 이 앱의 표기 규칙으로 바꾼다. 완벽하진 않으니 저장 전에 손볼 수 있게 한다. */
const HEAD_WORD = /^(재료|준비물|준비|조성|진행|방법|과정|순서|주의|참고|원리|설정|조작|보관|결과)/;
const PAIRS = { "<":">", "【":"】", "[":"]", "〈":"〉", "《":"》" };   // 괄호 ( ) 는 부연 설명이므로 제외
function autoFormat(lines){
  return lines
    .map(l => l.replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim())
    .filter(Boolean)
    .map(l => {
      let t = l.replace(/^[◎◇◆■□▶▷●○]\s*/, "");
      const close = PAIRS[t[0]];
      if(close && t.endsWith(close)){
        const bare = t.slice(1, -1).trim();
        if(bare && bare.length <= 30) return "[" + bare + "]";
      }
      if(/^[-–—•·]\s*/.test(t)) return "- " + t.replace(/^[-–—•·]\s*/, "");
      if(/^※/.test(t) || /^\(/.test(t) || /^★/.test(t)) return t;
      t = t.replace(/^\d+\s*[.)]\s*/, "");                       // 번호는 앱이 다시 매긴다
      if(t.length <= 14 && HEAD_WORD.test(t) && !/[.。]$/.test(t)) return "[" + t + "]";
      if(!/\s/.test(t) && t.length <= 20 && !/\d/.test(t) && !/[.。,]$/.test(t)) return "[" + t + "]";
      return t;
    })
    .filter(Boolean);
}

/* ══ 사진 ══ */
function readDataUrl(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error("파일을 읽지 못했습니다"));
    fr.readAsDataURL(file);
  });
}
async function shrink(file){
  const raw = await readDataUrl(file);
  try{
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("decode"));
      im.src = raw;
    });
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width  = Math.round(img.width  * scale);
    c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const out = c.toDataURL("image/jpeg", 0.75);
    return out.length < raw.length ? out : raw;
  }catch(e){ return raw; }
}
async function loadPics(sid, rid){
  const k = PKEY(sid, rid);
  if(pics[k] !== undefined) return;
  try{ pics[k] = (await Store.get(k)) || []; }

}

    ui.picErr = "이 회차의 사진 용량이 한도를 넘습니다. 오래된 사진을 지우고 다시 넣어 주세요.";
    render(); return false;
  }
  const k = PKEY(sid, rid);
  pics[k] = arr;

  flag("saving");
  try{ await Store.set(k, arr); await touch(k); flag("saved"); }
  catch(e){
    flag("error");
    ui.picErr = "저장 공간이 부족합니다. 사진을 줄이거나 백업 후 정리해 주세요.";
  }
  patchRun(sid, rid, { photoN: arr.length });
  return true;
}
async function addPics(sid, rid, fileList){
  const picked = Array.from(fileList || []);
  const files = picked.filter(f => f.type && f.type.startsWith("image/"));
  if(!files.length){ ui.picErr = picked.length ? "이미지 파일만 넣을 수 있습니다." : "고른 파일이 없습니다."; render(); return; }
  ui.busy = true; ui.picErr = ""; render();

    for(const f of files){
      made.push({ id: Date.now() + "_" + Math.random().toString(36).slice(2,7), name:f.name, caption:"", data: await shrink(f) });
    }
    await savePics(sid, rid, [...(pics[PKEY(sid, rid)] || []), ...made]);
  }catch(e){ ui.picErr = e.message || "사진을 넣지 못했습니다."; }

    if(sp.mats.length) ed.mats = join(ed.mats, sp.mats.join("\n"));

    if(!ed.name) ed.name = (file.name || "").replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").trim();
    ui.editor = ed;
  }catch(err){ ui.impErr = err.message || "파일을 읽지 못했습니다"; }
  ui.busy = false; render();
}

/* ══ 희석 계산기 ══ */
const DIL_CONC = {
  "M":{f:1,fam:"mol"}, "mM":{f:1e-3,fam:"mol"}, "µM":{f:1e-6,fam:"mol"}, "nM":{f:1e-9,fam:"mol"},
  "mg/ml":{f:1,fam:"mass"}, "µg/ml":{f:1e-3,fam:"mass"}, "ng/µl":{f:1e-3,fam:"mass"},
  "ng/ml":{f:1e-6,fam:"mass"}, "%(w/v)":{f:10,fam:"mass"}, "X":{f:1,fam:"x"},
};
const DIL_VOL = { "µl":1e-3, "ml":1, "L":1000 };
const DIL_DEF = {
  mode:"cv",
  c1:"10", c1u:"mg/ml", v1:"", v1u:"µl", c2:"0.5", c2u:"mg/ml", v2:"10", v2u:"ml",
  fFold:"1000", fFinal:"10", fFinalU:"ml",
  sConc:"100", sConcU:"mg/ml", sFold:"10", sSteps:"6", sVol:"1", sVolU:"ml",
  dBp:"5369", dNg:"10", dNm:"", dVol:"1", dLast:"ng",
};
const D = () => (S.dil = S.dil || { ...DIL_DEF });
const dnum = k => { const v = parseFloat(D()[k]); return isFinite(v) ? v : null; };
const dblank = k => String(D()[k] == null ? "" : D()[k]).trim() === "";
function sig(v, d = 4){
  if(!isFinite(v)) return "—";
  if(v === 0) return "0";
  const a = Math.abs(v);
  if(a >= 1e6 || a < 1e-4) return v.toExponential(2);
  return String(+v.toPrecision(d));
}
const dinput = (k, label, unitKey, units) => {
  const d = D();
  const sel = unitKey
    ? `<select data-act="dil" data-f="${unitKey}">${Object.keys(units).map(u =>
        `<option${d[unitKey]===u?" selected":""}>${u}</option>`).join("")}</select>` : "";
  return `<div><label>${label}</label><div class="pair">
    <input type="text" inputmode="decimal" value="${esc(d[k])}" data-act="dil" data-f="${k}"
      class="${dblank(k)&&d.mode==="cv"&&["c1","v1","c2","v2"].includes(k)?"solved":""}">${sel}</div></div>`;
};
const DIL_MODES = [["cv","C₁V₁ = C₂V₂"],["fold","배수 희석"],["serial","연속 희석"],["dna","DNA ng/µl ↔ nM"]];

function dilHTML(){

  let body;
  if(d.mode === "cv"){
    body = `<p class="hint">네 칸 중 <b>세 칸</b>을 채우면 빈 칸을 계산합니다. 지운 칸이 계산 대상이 됩니다.</p>
      <div class="calcgrid">
        ${dinput("c1","C₁ — stock 농도","c1u",DIL_CONC)}
        ${dinput("v1","V₁ — 넣을 stock 부피","v1u",DIL_VOL)}

      <div class="calcgrid">
        ${dinput("c2","C₂ — 목표 농도","c2u",DIL_CONC)}
        ${dinput("v2","V₂ — 최종 부피","v2u",DIL_VOL)}
      </div>`;
  }else if(d.mode === "fold"){
    body = `<p class="hint">1/1000 처럼 배수로 희석할 때 넣을 stock 과 희석액 양을 구합니다.</p>
      <div class="calcgrid">
        ${dinput("fFold","희석 배수 <span class='cu'>1 : N</span>")}

      </div>`;
  }else if(d.mode === "serial"){
    body = `<p class="hint">같은 배수로 여러 단계를 내려갈 때 각 tube 의 농도와 넣을 양을 표로 만듭니다.</p>
      <div class="calcgrid">
        ${dinput("sConc","Stock 농도","sConcU",DIL_CONC)}
        ${dinput("sFold","단계별 배수 <span class='cu'>1 : N</span>")}
      </div>
      <div class="calcgrid">
        ${dinput("sSteps","단계 수")}
        ${dinput("sVol","각 tube 최종 부피","sVolU",DIL_VOL)}
      </div>`;
  }else{
    body = `<p class="hint">이중가닥 DNA 기준. 염기쌍 평균 분자량 650 g/mol 을 씁니다.</p>
      <div class="calcgrid">
        ${dinput("dBp","길이 <span class='cu'>bp</span>")}
        ${dinput("dVol","부피 <span class='cu'>µl</span>")}
      </div>
      <div class="calcgrid">
        ${dinput("dNg","농도 <span class='cu'>ng/µl</span>")}
        ${dinput("dNm","농도 <span class='cu'>nM</span>")}
      </div>`;
  }
  return `<div class="chips" style="margin-bottom:14px">
      ${DIL_MODES.map(([m, lb]) => `<button class="chip ${d.mode===m?"on":""}" data-act="dil-mode" data-m="${m}">${lb}</button>`).join("")}
    </div>
    ${body}
    <div id="dilout">${dilOutHTML()}</div>`;
}
function dilOutHTML(){
  const d = D();
  const err = m => `<p class="picerr" style="margin:12px 0 0">${m}</p>`;
  const box = (label, big, note) => `<div class="out">
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:4px">${label}</div>
    <div class="big">${big}</div>${note?`<p class="note">${note}</p>`:""}</div>`;

  if(d.mode === "cv"){
    const keys = ["c1","v1","c2","v2"], empt = keys.filter(dblank);
    if(empt.length !== 1) return err(empt.length === 0 ? "계산할 칸을 하나 비워 주세요." : `빈 칸이 ${empt.length}개입니다. 세 칸을 채워 주세요.`);
    const t = empt[0], cu1 = DIL_CONC[d.c1u], cu2 = DIL_CONC[d.c2u];
    if(!t.startsWith("c") && cu1.fam !== cu2.fam) return err("C₁ 과 C₂ 의 단위 종류가 다릅니다. 몰 농도끼리, 질량 농도끼리 맞춰 주세요.");
    const c1 = dnum("c1") !== null ? dnum("c1")*cu1.f : null, c2 = dnum("c2") !== null ? dnum("c2")*cu2.f : null;
    const v1 = dnum("v1") !== null ? dnum("v1")*DIL_VOL[d.v1u] : null, v2 = dnum("v2") !== null ? dnum("v2")*DIL_VOL[d.v2u] : null;
    const bad = v => v === null || !isFinite(v) || v <= 0;
    if(t === "v1"){
      if(bad(c1)||bad(c2)||bad(v2)) return err("숫자를 0보다 큰 값으로 넣어 주세요.");
      if(c2 > c1) return err("목표 농도가 stock 보다 높습니다. 희석으로는 만들 수 없습니다.");
      const V = c2*v2/c1, u = d.v1u;
      return box("V₁ — 넣을 stock 부피", `${sig(V/DIL_VOL[u])} <span style="font-size:15px">${u}</span>`,
        `희석액 ${sig((v2-V)/DIL_VOL[u])} ${u} 를 더해 최종 ${sig(v2/DIL_VOL[u])} ${u} 로 맞춥니다.<br>희석 배수 1 : ${sig(v2/V)}`);
    }
    if(t === "v2"){
      if(bad(c1)||bad(c2)||bad(v1)) return err("숫자를 0보다 큰 값으로 넣어 주세요.");
      const V = c1*v1/c2, u = d.v2u;
      return box("V₂ — 최종 부피", `${sig(V/DIL_VOL[u])} <span style="font-size:15px">${u}</span>`,
        `희석액 ${sig((V-v1)/DIL_VOL[u])} ${u} 를 더합니다.`);
    }
    if(t === "c1"){
      if(bad(c2)||bad(v1)||bad(v2)) return err("숫자를 0보다 큰 값으로 넣어 주세요.");
      const C = c2*v2/v1, u = d.c1u;
      return box("C₁ — 필요한 stock 농도", `${sig(C/DIL_CONC[u].f)} <span style="font-size:15px">${u}</span>`,
        `이 stock 을 ${sig(v1/DIL_VOL[d.v1u])} ${d.v1u} 넣으면 됩니다.`);
    }
    if(bad(c1)||bad(v1)||bad(v2)) return err("숫자를 0보다 큰 값으로 넣어 주세요.");
    const C = c1*v1/v2, u = d.c2u;
    return box("C₂ — 만들어지는 농도", `${sig(C/DIL_CONC[u].f)} <span style="font-size:15px">${u}</span>`,
      `희석 배수 1 : ${sig(v2/v1)}`);
  }

  if(d.mode === "fold"){
    const n = dnum("fFold"), fv = dnum("fFinal"), u = d.fFinalU;
    if(!(n > 1) || !(fv > 0)) return err("배수는 1보다 크고, 부피는 0보다 커야 합니다.");
    const st = fv/n, dl = fv - st, inUl = st*DIL_VOL[u]/DIL_VOL["µl"];
    return `<table class="rt" style="margin-top:14px">
      <thead><tr><th>성분</th><th>부피</th></tr></thead><tbody>
      <tr><td>stock</td><td>${sig(st)} ${u}${u!=="µl"?` (= ${sig(inUl)} µl)`:""}</td></tr>
      <tr><td>희석액</td><td>${sig(dl)} ${u}</td></tr>
      <tr><td>최종</td><td>${sig(fv)} ${u}</td></tr></tbody></table>
      <p class="stat">1 : ${sig(n)} 희석 · stock 농도의 ${sig(100/n)} %</p>
      ${inUl < 1 ? err("stock 이 1 µl 미만입니다. 중간 희석을 한 단계 두는 편이 정확합니다.") : ""}`;
  }

  if(d.mode === "serial"){
    const c0 = dnum("sConc"), n = dnum("sFold"), k = parseInt(d.sSteps, 10), v = dnum("sVol");
    const cu = d.sConcU, vu = d.sVolU;
    if(!(c0 > 0) || !(n > 1) || !(k >= 1) || !(v > 0)) return err("농도·부피는 0보다, 배수는 1보다 커야 하고 단계는 1 이상이어야 합니다.");
    if(k > 20) return err("단계는 20 이하로 넣어 주세요.");
    const move = v/n, dl = v - move, moveUl = move*DIL_VOL[vu]/DIL_VOL["µl"];
    let rows = `<tr><td>stock</td><td>${sig(c0)} ${cu}</td><td>—</td><td>—</td></tr>`;
    for(let i = 1; i <= k; i++) rows += `<tr><td>#${i}</td><td>${sig(c0/Math.pow(n,i))} ${cu}</td><td>${sig(move)} ${vu}</td><td>${sig(dl)} ${vu}</td></tr>`;
    return `<table class="rt" style="margin-top:14px">
      <thead><tr><th>tube</th><th>농도</th><th>앞 tube 에서</th><th>희석액</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="stat">각 tube ${sig(v)} ${vu} · 매 단계 1 : ${sig(n)} · 최종 1 : ${sig(Math.pow(n,k))}</p>
      ${moveUl < 2 ? err("옮기는 양이 2 µl 미만입니다. tube 부피를 늘리거나 배수를 낮추세요.") : ""}`;
  }

  const bp = dnum("dBp"), vol = dnum("dVol");
  if(!(bp > 0)) return err("길이를 0보다 큰 값으로 넣어 주세요.");
  const MW = bp*650;
  let ng, nm;
  if(d.dLast === "nm"){
    nm = dnum("dNm"); if(nm === null || nm <= 0) return err("nM 값을 넣어 주세요.");
    ng = nm*MW/1e6;
  }else{
    ng = dnum("dNg"); if(ng === null || ng <= 0) return err("ng/µl 값을 넣어 주세요.");
    nm = ng*1e6/MW;
  }
  const pmol = vol !== null && vol > 0 ? nm*vol/1000 : null;
  return box(`분자량 ${sig(MW)} g/mol (${sig(bp)} bp × 650)`,
    `${sig(ng)} <span style="font-size:15px">ng/µl</span> = ${sig(nm)} <span style="font-size:15px">nM</span>`,
    `${pmol !== null ? `${sig(vol)} µl 안에 ${sig(pmol)} pmol (= ${sig(ng*vol)} ng)<br>` : ""}nM = ng/µl × 10⁶ ÷ (bp × 650)`);
}

/* ══ 타이머 ══
   초 단위 표시는 화면에서만 굴리고, 저장은 시작·정지 같은 조작이 있을 때만 한다.
   startedAt(시각)을 저장하므로 앱을 닫았다 열어도 시간이 이어진다. */
let tickTimer = null, audioCtx = null;

function fmtMs(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const pad = v => String(v).padStart(2, "0");
  return (h ? pad(h) + ":" : "") + pad(m) + ":" + pad(sec);
}
function timerNow(t){
  return (t.elapsed || 0) + (t.startedAt ? Date.now() - t.startedAt : 0);
}
function timerShown(t){
  return t.mode === "down" ? Math.max(0, t.ms - timerNow(t)) : timerNow(t);
}
function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = audioCtx || new AC();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [0, 0.4, 0.8].forEach(d => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.37);
    });
  }catch(e){}
}
function updateHeaderTimer(){
  const el = document.getElementById("hdtimer");
  if(!el) return;
  const list = S.timers || [];
  const done = list.filter(t => t.done);
  const run = list.filter(t => t.startedAt);
  let pick = null, cls = "hdtimer";
  if(done.length){ pick = done[0]; cls += " done"; }
  else if(run.length){
    const downs = run.filter(t => t.mode === "down");
    pick = downs.length ? downs.reduce((a, b) => (timerShown(a) <= timerShown(b) ? a : b)) : run[0];
  }
  if(!pick){ el.className = "hdtimer hide"; return; }
  const extra = (run.length + done.length) - 1;
  el.className = cls;
  el.innerHTML = `<b>${esc(fmtMs(timerShown(pick)))}</b><span class="hdname">${esc(pick.name)}</span>${extra > 0 ? `<span class="hdmore">+${extra}</span>` : ""}`;
}
function ensureTick(){
  const running = (S.timers || []).some(t => t.startedAt);
  if(running && !tickTimer) tickTimer = setInterval(tick, 250);
  if(!running && tickTimer){ clearInterval(tickTimer); tickTimer = null; }
}
function tick(){
  let finished = false;
  (S.timers || []).forEach(t => {
    if(t.mode === "down" && t.startedAt && t.ms - timerNow(t) <= 0 && !t.done){
      t.done = true; t.elapsed = t.ms; t.startedAt = null; finished = true;
    }
    const el = document.querySelector(`[data-t="${t.id}"]`);
    if(el) el.textContent = fmtMs(timerShown(t));
  });
  updateHeaderTimer();
  if(finished){ beep(); save(); render(); }
}
const PRESETS = [
  ["30초", 30], ["1분", 60], ["1분 20초", 80], ["3분", 180], ["5분", 300],
  ["10분", 600], ["15분", 900], ["20분", 1200], ["30분", 1800], ["1시간", 3600], ["2시간", 7200],
];
function secLabel(sec){
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s2 = Math.round(sec % 60);
  return [h ? h + "시간" : "", m ? m + "분" : "", s2 ? s2 + "초" : ""].filter(Boolean).join(" ") || "0초";
}
function addTimer(sec, name){
  const t = { id:"t"+Date.now(), name:name || (sec ? secLabel(sec) + " 타이머" : "스톱워치"),
              mode: sec ? "down" : "up", ms:Math.round((sec || 0) * 1000),
              startedAt:Date.now(), elapsed:0, done:false };
  S.timers = (S.timers || []).concat(t);
  beep(); if(audioCtx && audioCtx.state === "running"){ /* 소리 권한 확보용 */ }
  save(); render();
}
function timerHTML(){
  const list = S.timers || [];
  return `<div class="card2">
    <div class="frow"><span class="flabel" style="margin:0">스톱워치 · 타이머</span></div>
    <div class="chips" style="margin-bottom:12px">
      ${PRESETS.map(([lb, m]) => `<button class="chip" data-act="tadd" data-m="${m}">${lb}</button>`).join("")}

    </div>
    <div class="tgrid3" style="margin-bottom:14px">
      <div><label for="tmin">분</label>
        <input id="tmin" type="text" inputmode="numeric" placeholder="0" data-act="tmin" value="${esc(ui.tmin || "")}"></div>
      <div><label for="tsec">초</label>
        <input id="tsec" type="text" inputmode="numeric" placeholder="0" data-act="tsec" value="${esc(ui.tsec || "")}"></div>
      <div><label for="tnm">이름 <span class="cu">선택</span></label>
        <input id="tnm" type="text" placeholder="예: sonication" data-act="tname-new" value="${esc(ui.tname || "")}"></div>
    </div>
    <button class="addbtn" data-act="tadd-custom">＋ 타이머 시작</button>
    ${list.length === 0 ? `<p class="empty" style="margin-top:14px">돌아가는 타이머가 없습니다. 위에서 하나 고르세요.</p>` : ""}
    ${list.map(t => `<div class="tcard ${t.startedAt?"run":""} ${t.done?"done":""}">
      <div class="trow">
        <input type="text" value="${esc(t.name)}" data-act="tname" data-id="${t.id}">
        <button class="x" data-act="tdel" data-id="${t.id}" title="삭제">×</button>
      </div>

      <div class="tmeta">${t.mode === "down" ? fmtMs(t.ms) + " 카운트다운" : "경과 시간 (스톱워치)"}${t.done?" · 끝났습니다":""}</div>
      <div class="chips">
        <button class="chip" data-act="ttoggle" data-id="${t.id}">${t.startedAt?"일시정지":(t.done?"다시 시작":"시작")}</button>
        <button class="chip" data-act="treset" data-id="${t.id}">초기화</button>
      </div>
    </div>`).join("")}
  </div>`;
}
const TOOL_TABS = [["timer","스톱워치 · 타이머"],["lig","Ligation 계산기"],["dil","희석 계산기"]];

function viewFlow(){

          </div><button class="x" data-act="deltr" data-id="${t.id}">×</button></div>`).join("")
          : `<p class="empty">아직 기록이 없습니다. 문제가 생기면 원인·해결을 남겨 다음 실험에 참고하세요. 날짜는 넣지 않아도 저장됩니다.</p>`}
        </div>
        ${e.runs.length > 1 ? `<button class="delbtn" data-act="delrun" data-id="${r.id}">이 회차 삭제</button>` : ""}
      </div></div>`;
  };

  const detail = `<div class="detail">
    <div class="dhead">
      <div class="dtop"><div class="dphase">${esc(st.phaseLabel)}</div>
        <div class="dtopbtns">
          ${isMine(st.id)?`<button class="delbtn" data-act="ed-edit" data-id="${st.id}">편집</button>`:""}
          <button class="herebtn ${S.current===st.id?"on":""}" data-act="here" data-id="${st.id}">${S.current===st.id?"✓ 진행 중으로 표시됨":"지금 여기 진행 중"}</button>
        </div></div>
      <h2>${esc(st.name)}</h2><p class="dnote">${esc(st.note)}</p>
    </div>
    <div class="field"><div class="frow"><label>실험 방법</label>
      <button class="toggle" data-act="toggleproto">${ui.showProto?"접기 ▲":"펼치기 ▼"}</button></div>${proto}</div>
    ${TOOLS[st.id] === "ligation" ? ligHTML() : ""}
    <div class="field">
      <div class="frow"><label>시행 기록 · ${e.runs.length}회</label>
        <button class="addbtn" data-act="addrun">＋ 회차 추가</button></div>
      ${e.runs.map(runCard).join("")}
    </div>
  </div>`;

  return banner
    + `<div class="bar"><i style="width:${pct}%"></i><span>${done}/${steps.length} 단계 완료 · ${pct}%</span></div>`
    + `<div class="legend">` + STATUSES.map(s => `<b><i style="background:${s.dot}"></i>${s.label} ${steps.filter(x=>stepStatus(x.id)===s.id).length}</b>`).join("") + `</div>`
    + `<div class="split ${ui.detail?"detail-mode":""}">
         <div class="pane-list">${list}</div>
         <div class="pane-detail"><button class="backbtn" data-act="back">‹ 목록</button>${detail}</div>
       </div>`;
}

      <div class="field"><label for="mm">내 메모</label>

    </div>`;
  } else detail = `<div class="detail"><p class="empty">왼쪽에서 항목을 고르세요.</p></div>`;

    <div class="split ${ui.detail?"detail-mode":""}">

function render(){
  const app = document.getElementById("app");
  const focus = document.activeElement;
  let keep = null;
  if(focus && focus.dataset && focus.dataset.act){
    let pos = null;
    try{ pos = focus.selectionStart; }catch(e){}   // date 입력은 selectionStart를 못 읽는다
    keep = { act:focus.dataset.act, id:focus.dataset.id || "", f:focus.dataset.f || "", pos };
  }

  app.innerHTML = ui.tab === "flow" ? viewFlow() : ui.tab === "tools" ? viewTools() : viewPrep();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === ui.tab));

  if(keep){
    const sel = `[data-act="${keep.act}"]` + (keep.id?`[data-id="${keep.id}"]`:"") + (keep.f?`[data-f="${keep.f}"]`:"");
    const n = app.querySelector(sel);
    if(n && n.focus){ n.focus(); if(keep.pos != null){ try{ n.setSelectionRange(keep.pos, keep.pos); }catch(e){} } }
  }
  if(ui.tab === "flow" && ui.run){ const r = runOf(ui.step); if(r) loadPics(ui.step, r.id); }
  ensureTick();
  updateHeaderTimer();
}

/* ══ 이벤트 ══ */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  ui.tab = b.dataset.tab; ui.detail = false; ui.impErr = ""; render();
});

document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(a === "open"){
    ui.step = id; ui.detail = true; ui.picErr = "";
    const rs = stepEntry(id).runs; ui.run = rs[rs.length - 1].id;
    render(); window.scrollTo(0,0);
  }
  else if(a === "run"){ ui.run = (ui.run === id ? null : id); ui.picErr = ""; render(); }
  else if(a === "addrun"){
    const e = stepEntry(ui.step), r = newRun();
    const last = e.runs[e.runs.length - 1];
    r.status = "todo";
    e.runs.push(r); ui.run = r.id; ui.picErr = "";
    save(); render();
  }
  else if(a === "delrun"){
    const e = stepEntry(ui.step);
    if(e.runs.length <= 1) return;
    Store.del(PKEY(ui.step, id)); delete pics[PKEY(ui.step, id)];
    e.runs = e.runs.filter(r => r.id !== id);
    ui.run = e.runs[e.runs.length - 1].id;
    save(); render();
  }
  else if(a === "openr"){ ui.recipe = id; ui.detail = true; render(); window.scrollTo(0,0); }
  else if(a === "back"){ ui.detail = false; render(); }
  else if(a === "here"){ S.current = S.current === id ? null : id; save(); render(); }
  else if(a === "status"){ patchRun(ui.step, runOf(ui.step).id, { status:b.dataset.v }); }
  else if(a === "toggleproto"){ ui.showProto = !ui.showProto; render(); }
  else if(a === "addtr"){
    const r = runOf(ui.step);
    patchRun(ui.step, r.id, { trouble:[...(r.trouble || []), { id:Date.now(), date:"", problem:"", cause:"", fix:"" }] });
  }
  else if(a === "deltr"){
    const r = runOf(ui.step);
    patchRun(ui.step, r.id, { trouble:(r.trouble || []).filter(t => String(t.id) !== id) });
  }
  else if(a === "pick"){ document.getElementById("picinput").click(); }
  else if(a === "delpic"){ const r = runOf(ui.step); savePics(ui.step, r.id, (pics[PKEY(ui.step, r.id)]||[]).filter(p => p.id !== id)); }
  else if(a === "zoom"){ const r = runOf(ui.step); const p = (pics[PKEY(ui.step, r.id)]||[]).find(x => x.id === id); if(p) lightbox(p); }
  else if(a === "tool"){ ui.tool = id; render(); window.scrollTo(0,0); }
  else if(a === "dil-mode"){ D().mode = b.dataset.m; save(); render(); }
  else if(a === "tadd"){ addTimer(+b.dataset.m, +b.dataset.m ? null : "스톱워치"); }
  else if(a === "tadd-custom"){
    const m = parseFloat(ui.tmin) || 0, sc = parseFloat(ui.tsec) || 0;
    const total = m * 60 + sc;
    addTimer(total > 0 ? total : 0, ui.tname || null);
    ui.tmin = ""; ui.tsec = ""; ui.tname = ""; render();
  }
  else if(a === "ttoggle"){
    const t = (S.timers || []).find(x => x.id === id);
    if(t){
      if(t.startedAt){ t.elapsed = timerNow(t); t.startedAt = null; }
      else { if(t.done){ t.done = false; t.elapsed = 0; } t.startedAt = Date.now(); beep(); }
      save(); render();
    }
  }
  else if(a === "treset"){
    const t = (S.timers || []).find(x => x.id === id);
    if(t){ t.startedAt = null; t.elapsed = 0; t.done = false; save(); render(); }
  }
  else if(a === "tdel"){ S.timers = (S.timers || []).filter(x => x.id !== id); save(); render(); }
  else if(a === "gmanage"){ ui.groups = id; render(); window.scrollTo(0,0); }
  else if(a === "gdone"){ ui.groups = null; render(); }
  else if(a === "gadd"){
    const g = { id:"g"+Date.now(), label:"새 묶음" };
    if(ui.groups === "flow"){ S.phaseExtra = (S.phaseExtra||[]).concat(g); }
    else { S.catExtra = (S.catExtra||[]).concat(g); }
    save(); render();
  }
  else if(a === "gdel"){
    if(ui.groups === "flow"){
      const home = PHASES[0].id;
      (S.customSteps||[]).forEach(c => { if(c.phase === id) c.phase = home; });
      S.phaseExtra = (S.phaseExtra||[]).filter(g => g.id !== id);
    }else{
      (S.custom||[]).forEach(c => { if((c.cat||"mine") === id) c.cat = "mine"; });
      S.catExtra = (S.catExtra||[]).filter(g => g.id !== id);
    }
    save(); render();
  }
  else if(a === "calc-reset"){ S.calc = { ...CALC_DEF }; save(); render(); }
  else if(a === "ed-new"){ ui.editor = { kind:"step", id:null, phase:PHASES[0].id, name:"", note:"", mats:"", text:"" }; ui.impErr = ""; render(); window.scrollTo(0,0); }
  else if(a === "ed-edit"){
    const c = S.customSteps.find(x => x.id === id);
    if(c){
      const sp = splitProtocol(c.protocol || []);
      ui.editor = { kind:"step", id:c.id, phase:c.phase, name:c.name, note:c.note, mats:sp.mats.join("\n"), text:sp.proc.join("\n") };
      ui.impErr = ""; render(); window.scrollTo(0,0);
    }
  }
  else if(a === "ed-line"){
    if(!ui.editor) return;
    const raw = ui.editor.text.split(/\r?\n/);
    const i = +b.dataset.i;
    const t = (raw[i] || "").trim();
    if(!t || KEEP.test(t)) return;
    raw[i] = /^-\s*/.test(t) ? t.replace(/^-\s*/, "") : "- " + t;
    ui.editor.text = raw.join("\n");
    syncTextarea();
  }
  else if(a === "ed-allnum" || a === "ed-alldash"){
    if(!ui.editor) return;
    const dash = a === "ed-alldash";
    ui.editor.text = ui.editor.text.split(/\r?\n/).map(l => {
      const t = l.trim();
      if(!t || KEEP.test(t)) return l;
      return dash ? (/^-\s*/.test(t) ? t : "- " + t) : t.replace(/^-\s*/, "");
    }).join("\n");
    syncTextarea();
  }
  else if(a === "ed-pick"){ document.getElementById("docinput").click(); }
  else if(a === "ed-cancel"){ const wasPrep = ui.editor.kind === "prep"; ui.editor = null; if(wasPrep) ui.detail = !!ui.recipe; render(); }
  else if(a === "ed-del"){
    if(ui.editor.kind === "prep"){
      const cid = ui.editor.id;
      S.custom = S.custom.filter(x => x.id !== cid);
      ui.editor = null; ui.recipe = RECIPES[0].id; ui.detail = false;
      save(); render(); return;
    }
    const eid = ui.editor.id;
    stepEntry(eid).runs.forEach(r => {                  // 회차마다 사진이 따로 저장되므로 전부 지운다
      const k = PKEY(eid, r.id);
      Store.del(k); delete pics[k];
    });
    S.customSteps = S.customSteps.filter(x => x.id !== eid);
    delete S.steps[eid];
    if(S.current === eid) S.current = null;
    ui.editor = null; ui.step = PHASES[0].steps[0].id; ui.detail = false;
    save(); render();
  }
  else if(a === "ed-save"){
    const ed = ui.editor;
    const lines = joinLines().map(r => r.t);
    if(!ed.name.trim()){ ui.impErr = "이름을 적어 주세요."; render(); return; }
    if(!lines.length){ ui.impErr = "내용이 비어 있습니다."; render(); return; }
    if(ed.kind === "prep"){
      const body = lines.join("\n");
      if(ed.id){
        const c = S.custom.find(x => x.id === ed.id);
        if(c){ c.name = ed.name.trim(); c.body = body; c.cat = ed.cat || "mine"; ui.recipe = c.id; }
      }else{
        const it = { id:"c"+Date.now(), name:ed.name.trim(), body, cat:ed.cat || "mine" };
        S.custom.push(it); ui.recipe = it.id;
      }
      ui.editor = null; ui.detail = true; ui.impErr = "";
      save(); render(); return;
    }
    if(ed.id){
      const c = S.customSteps.find(x => x.id === ed.id);
      Object.assign(c, { phase:ed.phase, name:ed.name.trim(), note:ed.note.trim(), protocol:lines });
      ui.step = c.id;
    }else{
      const it = { id:"s"+Date.now(), phase:ed.phase, name:ed.name.trim(), note:ed.note.trim(), protocol:lines };
      S.customSteps.push(it);
      S.steps[it.id] = blank();
      ui.step = it.id;
    }
    ui.editor = null; ui.detail = true; ui.impErr = "";
    save(); render();
  }
  else if(a === "addcustom"){ ui.editor = { kind:"prep", id:null, phase:"", cat:"mine", name:"", note:"", mats:"", text:"" }; ui.impErr = ""; render(); window.scrollTo(0,0); }
  else if(a === "prepedit"){
    const c = S.custom.find(x => x.id === id);
    if(c){
      const sp = splitProtocol((c.body || "").split(/\r?\n/).map(x => x.trim()).filter(Boolean));
      ui.editor = { kind:"prep", id:c.id, phase:"", cat:c.cat || "mine", name:c.name, note:"", mats:sp.mats.join("\n"), text:sp.proc.join("\n") };
      ui.impErr = ""; render(); window.scrollTo(0,0);
    }
  }
  else if(a === "delcustom"){ S.custom = S.custom.filter(c => c.id !== id); ui.recipe = RECIPES[0].id; save(); render(); }
});

document.getElementById("app").addEventListener("input", e => {
  const t = e.target, a = t.dataset.act; if(!a) return;
  if(a === "date")   { runOf(ui.step).date = t.value; save(); }
  else if(a === "result") { runOf(ui.step).result = t.value; save(); }
  else if(a === "memo")   { S.memos[t.dataset.id] = t.value; save(); }
  else if(a === "tr"){
    const tr = (runOf(ui.step).trouble || []).find(x => String(x.id) === t.dataset.id);
    if(tr){ tr[t.dataset.f] = t.value; save(); }
  }
  else if(a === "ed-name"){ ui.editor.name = t.value; }
  else if(a === "ed-note"){ ui.editor.note = t.value; }
  else if(a === "ed-text"){ ui.editor.text = t.value; updatePreview(); }
  else if(a === "calc"){
    S.calc = { ...(S.calc || CALC_DEF), [t.dataset.f]:t.value };
    save(); updateCalc();
  }
  else if(a === "ed-mats"){ ui.editor.mats = t.value; updatePreview(); }
  else if(a === "dil"){
    const f = t.dataset.f;
    D()[f] = t.value;
    if(f === "dNg") D().dLast = "ng";
    if(f === "dNm") D().dLast = "nm";
    save(); updateDilOut();
  }
  else if(a === "tmin"){ ui.tmin = t.value; }
  else if(a === "tsec"){ ui.tsec = t.value; }
  else if(a === "tname-new"){ ui.tname = t.value; }
  else if(a === "tname"){
    const tm = (S.timers || []).find(x => x.id === t.dataset.id);
    if(tm){ tm.name = t.value; save(); }
  }
  else if(a === "gname"){
    const id = t.dataset.id, v = t.value;
    if(ui.groups === "flow"){
      if(PHASES.some(p => p.id === id)){ S.phaseNames = { ...(S.phaseNames||{}), [id]:v }; }
      else { S.phaseExtra = (S.phaseExtra||[]).map(g => g.id === id ? { ...g, label:v } : g); }
    }else{
      if(RECIPE_CATS.some(c => c.id === id) || id === "mine"){ S.catNames = { ...(S.catNames||{}), [id]:v }; }
      else { S.catExtra = (S.catExtra||[]).map(g => g.id === id ? { ...g, label:v } : g); }
    }
    save();
  }
  else if(a === "cap"){
    const r = runOf(ui.step), k = PKEY(ui.step, r.id);
    const arr = (pics[k]||[]).map(p => p.id === t.dataset.id ? { ...p, caption:t.value } : p);
    clearTimeout(window.__capT);
    pics[k] = arr;
    window.__capT = setTimeout(() => savePics(ui.step, r.id, arr), 500);
  }
});

document.getElementById("app").addEventListener("change", e => {
  if(e.target.dataset.act === "dil"){
    D()[e.target.dataset.f] = e.target.value; save(); updateDilOut(); return;
  }
  if(e.target.dataset.act === "ed-phase"){
    if(ui.editor.kind === "prep") ui.editor.cat = e.target.value; else ui.editor.phase = e.target.value;
    return;
  }
  if(e.target.id === "docinput"){
    const el = e.target, f = (el.files || [])[0];
    if(f) importDoc(f).then(() => { el.value = ""; });
    return;
  }
  if(e.target.id === "picinput"){
    const el = e.target, files = Array.from(el.files || []);
    addPics(ui.step, runOf(ui.step).id, files).then(() => { el.value = ""; });
  }
});

document.getElementById("app").addEventListener("dragover", e => {
  const d = e.target.closest("#drop, #impdrop"); if(!d) return;
  e.preventDefault(); d.classList.add("over");
});
document.getElementById("app").addEventListener("dragleave", e => {
  const d = e.target.closest("#drop, #impdrop"); if(d) d.classList.remove("over");
});
document.getElementById("app").addEventListener("drop", e => {
  const i = e.target.closest("#impdrop");
  if(i){ e.preventDefault(); i.classList.remove("over"); const f = (e.dataTransfer.files||[])[0]; if(f) importDoc(f); return; }
  const d = e.target.closest("#drop"); if(!d) return;
  e.preventDefault(); d.classList.remove("over");
  addPics(ui.step, runOf(ui.step).id, e.dataTransfer.files);
});

function lightbox(p){
  const w = document.createElement("div");
  w.className = "lbox";
  w.innerHTML = `<img src="${p.data}" alt="${esc(p.caption||p.name)}">${p.caption?`<p>${esc(p.caption)}</p>`:""}<button>닫기 ×</button>`;
  const close = () => { w.remove(); document.removeEventListener("keydown", key); };
  const key = ev => ev.key === "Escape" && close();
  w.addEventListener("click", close);
  document.addEventListener("keydown", key);
  document.body.appendChild(w);
}

let sheetUI = { stage:"idle", mode:"pw", email:"", msg:"" };

function sheetHTML(){
  const where = { idb:"기기 내부 저장소(IndexedDB)", local:"브라우저 저장소(localStorage)", memory:"저장 안 됨 — 새로고침하면 사라집니다" }[Store.mode];
  let sync;
  if(!supaReady()){
    sync = `<p class="sublbl">동기화 설정</p>
      <input type="text" id="supaurl" placeholder="Project URL (https://xxxx.supabase.co)" value="${esc(supa.url)}">
      <input type="text" id="supakey" placeholder="anon public key (eyJ...) 또는 Publishable key" value="${esc(supa.key)}" style="margin-top:8px">
      <button class="row" data-x="cfgsave" style="margin-top:9px">설정 저장</button>
      <p class="stat">Project Settings → API 에서 복사합니다.<br>주소는 https://xxxxxxxx.supabase.co 형태입니다.</p>`;
  }else if(!signedIn()){
    if(sheetUI.stage === "code"){
      sync = `<p class="sublbl">${esc(sheetUI.email)} 로 보낸 메일을 확인하세요</p>
        <input type="text" id="otpcode" placeholder="인증 코드, 또는 메일의 링크를 복사해 붙여넣기">
        <button class="row" data-x="verify" style="margin-top:9px">로그인</button>
        <button class="row" data-x="resend">메일 다시 받기</button>
        <button class="row" data-x="mode-pw">비밀번호 방식으로 바꾸기</button>`;
    }else if(sheetUI.mode === "otp"){
      sync = `<p class="sublbl">이메일 코드로 로그인</p>
        <input type="email" id="supamail" inputmode="email" placeholder="이메일 주소" value="${esc(sheetUI.email)}">
        <button class="row" data-x="sendcode" style="margin-top:9px">메일 받기</button>
        <button class="row" data-x="mode-pw">비밀번호 방식으로 바꾸기</button>`;
    }else{
      sync = `<p class="sublbl">동기화 로그인</p>
        <input type="email" id="supamail" inputmode="email" placeholder="이메일 주소" value="${esc(sheetUI.email)}">
        <input type="password" id="supapw" placeholder="비밀번호 (직접 정하세요)" style="margin-top:8px">
        <button class="row" data-x="pwin" style="margin-top:9px">로그인</button>
        <button class="row" data-x="pwup">처음이에요 — 계정 만들기</button>
        <button class="row" data-x="mode-otp">이메일 코드 방식으로 바꾸기</button>
        <p class="stat">연결 주소 · ${esc(supa.url)}</p>
        <button class="row" data-x="cfgreset">주소·키 다시 넣기</button>`;
    }
  }else{
    const t = syncState.at ? new Date(syncState.at).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" }) : "아직 없음";
    sync = `<p class="sublbl">동기화 · ${esc(supa.email)}</p>
      <button class="row" data-x="syncnow">${syncState.busy?"동기화 중…":"지금 동기화"}</button>
      <button class="row" data-x="signout">로그아웃</button>
      <p class="stat">마지막 동기화 ${esc(t)}${syncState.msg?" · "+esc(syncState.msg):""}</p>`;
  }
  if(sheetUI.msg) sync += `<p class="picerr" style="margin:8px 0 0">${esc(sheetUI.msg)}</p>`;

  return `<div class="card">
    <h3>기록 관리</h3><p class="sub">기록은 기기에 저장되고, 동기화를 켜면 기기 사이에서 맞춰집니다.</p>
    ${sync}
    <hr class="sep">
    <button class="row" data-x="export">기록 내보내기 (JSON 백업)</button>
    <button class="row" data-x="import">백업 불러오기</button>
    <input type="file" accept="application/json,.json" id="impfile" style="display:none">
    <p class="stat">저장 위치 · ${esc(where)}<br>단계 ${allSteps().length}개 · 사진 ${allSteps().reduce((n,x)=>n+((S.steps[x.id]||{}).photoN||0),0)}장</p>
    <button class="row close" data-x="close">닫기</button></div>`;
}
function refreshSheet(){
  const w = document.querySelector(".sheet");
  if(w) w.innerHTML = sheetHTML();
}
function openSheet(){
  sheetUI = { stage:"idle", mode:sheetUI.mode || "pw", email:supa.email || sheetUI.email || "", msg:"" };
  const w = document.createElement("div");
  w.className = "sheet";
  w.innerHTML = sheetHTML();
  const val = id => { const n = w.querySelector("#" + id); return n ? n.value.trim() : ""; };
  w.addEventListener("click", async e => {
    if(e.target === w) return w.remove();
    const b = e.target.closest("[data-x]"); if(!b) return;
    const x = b.dataset.x;
    sheetUI.msg = "";
    try{
      if(x === "close") return w.remove();
      if(x === "export"){ await exportAll(); return w.remove(); }
      if(x === "import") return w.querySelector("#impfile").click();
      if(x === "cfgsave"){
        const url = normUrl(val("supaurl")), key = val("supakey").replace(/\s+/g, "");
        if(!url || !key){ sheetUI.msg = "두 값을 모두 넣어 주세요."; return refreshSheet(); }
        const warn = urlWarning(url);
        if(warn){ sheetUI.msg = warn; return refreshSheet(); }
        if(/^sb_secret_|service_role/i.test(key)){
          sheetUI.msg = "이 키는 앱에 넣으면 안 됩니다. anon public 또는 Publishable 키를 쓰세요.";
          return refreshSheet();
        }
        await Store.set(CFG_K, { url, key });
        supa.url = url; supa.key = key;
        return refreshSheet();
      }
      if(x === "sendcode" || x === "resend"){
        const em = x === "resend" ? sheetUI.email : val("supamail");
        if(!em){ sheetUI.msg = "이메일을 넣어 주세요."; return refreshSheet(); }
        sheetUI.email = em; sheetUI.msg = "보내는 중…"; refreshSheet();
        await sendCode(em);
        sheetUI.stage = "code"; sheetUI.msg = "";
        return refreshSheet();
      }
      if(x === "verify"){
        const code = val("otpcode");
        if(!code){ sheetUI.msg = "코드를 넣어 주세요."; return refreshSheet(); }
        sheetUI.msg = "확인 중…"; refreshSheet();
        await verifyCode(sheetUI.email, code);
        sheetUI.stage = "idle"; sheetUI.msg = "";
        refreshSheet();
        return syncNow(false);
      }
      if(x === "cfgreset"){ await Store.set(CFG_K, { url:"", key:"" }); supa.url = ""; supa.key = ""; return refreshSheet(); }
      if(x === "mode-pw"){ sheetUI.mode = "pw"; sheetUI.stage = "idle"; return refreshSheet(); }
      if(x === "mode-otp"){ sheetUI.mode = "otp"; sheetUI.stage = "idle"; return refreshSheet(); }
      if(x === "pwin" || x === "pwup"){
        const em = val("supamail"), pw = val("supapw");
        if(!em || !pw){ sheetUI.msg = "이메일과 비밀번호를 모두 넣어 주세요."; return refreshSheet(); }
        if(pw.length < 6){ sheetUI.msg = "비밀번호는 6자 이상이어야 합니다."; return refreshSheet(); }
        sheetUI.email = em; sheetUI.msg = "확인 중…"; refreshSheet();
        if(x === "pwup"){
          const r = await signUpPw(em, pw);
          if(r === "confirm"){
            sheetUI.msg = "계정이 만들어졌습니다. 메일로 온 확인 링크를 한 번 누른 뒤, 같은 이메일·비밀번호로 다시 로그인하세요. (확인은 계정당 한 번뿐입니다.)";
            return refreshSheet();
          }
        }else{
          await signInPw(em, pw);
        }
        sheetUI.msg = ""; refreshSheet();
        return syncNow(false);
      }
      if(x === "signout"){ await signOut(); sheetUI.stage = "idle"; return refreshSheet(); }
      if(x === "syncnow") return syncNow(false);
    }catch(err){
      sheetUI.msg = err.message || String(err);
      refreshSheet();
    }
  });
  w.addEventListener("change", async e => {
    if(e.target.id !== "impfile" || !e.target.files[0]) return;
    try{ await importAll(e.target.files[0]); w.remove(); flag("saved"); }
    catch(err){ sheetUI.msg = "불러오지 못했습니다: " + err.message; refreshSheet(); }
  });
  document.body.appendChild(w);
}
document.getElementById("menu").addEventListener("click", openSheet);
document.getElementById("hdtimer").addEventListener("click", () => {
  ui.tab = "tools"; ui.tool = "timer"; render(); window.scrollTo(0, 0);
});

document.addEventListener("visibilitychange", () => { if(!document.hidden) syncNow(true); });

(async () => {
  await Store.init();
  let init = null;
  try{ init = await Store.get(KEY); }catch(e){}
  S = init || S;
  S.steps = S.steps || {}; S.memos = S.memos || {}; S.custom = S.custom || []; S.customSteps = S.customSteps || []; S.calc = S.calc || { ...CALC_DEF };
  S.timers = S.timers || []; S.dil = S.dil || { ...DIL_DEF };
  S.phaseNames = S.phaseNames || {}; S.phaseExtra = S.phaseExtra || [];
  S.catNames = S.catNames || {}; S.catExtra = S.catExtra || [];
  allSteps().forEach(s => stepEntry(s.id));
  render();
  await supaLoad();
  syncNow(true);
})();
